<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>页面不存在 · BTC Options</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #131722;
        --panel: #1e222d;
        --line: #2a2e39;
        --muted: #787b86;
        --text: #d1d4dc;
        --blue: #2962ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(520px, 100%);
        padding: 28px;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .code {
        margin: 0 0 8px;
        color: var(--blue);
        font: 700 2rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 12px;
        background: var(--blue);
        color: #fff;
        text-decoration: none;
        font-size: 0.78rem;
      }
      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>这个页面不存在</h1>
      <p>The page you requested does not exist.</p>
      <a href="/options/">返回 Sell Put</a>
    </main>
  </body>
</html>
