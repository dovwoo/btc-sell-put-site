<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0" integrity="sha384-cVMg8E3QFwTvGCDuK+ET4PD341jF3W8nO1auiXfuZNQkzbUUiBGLsIQUE+b1mxws" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:dark;
  --bg:#0a0c10;--panel:#11141a;--panel2:#161a22;--panel3:#1c212b;
  --line:#1e232d;--line2:#262c38;--line3:#323a48;
  --text:#c9ced6;--text2:#9aa1ad;--muted:#7a8290;--faint:#4a5260;
  --amber:#d4a024;--amber-bright:#f0b93a;--amber-dim:#8a6c1a;
  --green:#3fa47f;--red:#c75454;
  --mono:"SF Mono","Menlo","Consolas","DejaVu Sans Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;
}
html{font-feature-settings:"tnum" 1,"lnum" 1}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
html.owner-pending body{visibility:hidden}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
/* ============ TOP BAR ============ */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);height:38px;background:var(--panel)}
.bar h1{font-family:var(--mono);font-size:.78rem;color:var(--text);font-weight:600;text-align:center;letter-spacing:.04em;text-transform:uppercase}
.bar .right{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.bar .ts{font-family:var(--mono);font-size:.66rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lang{justify-self:start;background:transparent;color:var(--muted);border:1px solid var(--line2);padding:3px 10px;border-radius:0;font-family:var(--mono);font-size:.66rem;cursor:pointer;letter-spacing:.05em}
.lang:hover{color:var(--amber);border-color:var(--amber-dim)}
.nav,.strategy-switch{display:flex;align-items:center;border:1px solid var(--line2);border-radius:0;overflow:hidden;background:transparent}
.nav a{color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:.66rem;padding:4px 10px;border-right:1px solid var(--line2);background:transparent;white-space:nowrap;letter-spacing:.05em;text-transform:uppercase}
.nav a:last-child{border-right:0}
.nav a:hover{color:var(--text);background:var(--panel2)}
.nav a.on{color:var(--amber);background:transparent;box-shadow:inset 0 -1px 0 var(--amber)}
.utility-nav{color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:.64rem;padding:4px 8px;white-space:nowrap;letter-spacing:.04em}
.utility-nav:hover,.utility-nav.on{color:var(--text)}
/* ============ MAIN LAYOUT ============ */
.wrap{padding:12px 16px;max-width:1440px;margin:0 auto}
/* ============ MARKET STATUS LINE ============ */
.market-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.strategy-switch a{min-width:88px;height:28px;padding:0 12px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line2);color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.strategy-switch a:last-child{border-right:0}
.strategy-switch a:hover{color:var(--text);background:var(--panel2)}
.strategy-switch a.on{color:var(--amber);box-shadow:inset 0 -1px 0 var(--amber)}
.asset-switch{display:inline-flex;border:1px solid var(--line2);border-radius:0;overflow:hidden;background:transparent}
.asset-switch button,.asset-switch a{min-width:56px;height:28px;padding:0 12px;border:0;border-right:1px solid var(--line2);background:transparent;color:var(--muted);font-family:var(--mono);font-size:.7rem;font-weight:600;cursor:pointer;letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.asset-switch button:last-child,.asset-switch a:last-child{border-right:0}
.asset-switch button:hover,.asset-switch a:hover{color:var(--text);background:var(--panel2)}
.asset-switch button.on,.asset-switch a.on{background:transparent;color:var(--amber);box-shadow:inset 0 -1px 0 var(--amber)}
.stock-search{display:none;align-items:center;gap:6px;flex-wrap:wrap}
.stock-search.on{display:flex}
.stock-search input{width:150px;height:28px;padding:0 9px;border:1px solid var(--line2);border-radius:0;background:transparent;color:var(--text);font-family:var(--mono);font-size:.7rem;text-transform:uppercase}
.stock-search button{height:28px;padding:0 11px;border:1px solid var(--amber);border-radius:0;background:transparent;color:var(--amber);font-family:var(--mono);font-size:.66rem;cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.stock-search button:hover{background:var(--amber);color:var(--bg)}
.stock-search-error{font-size:.64rem;color:var(--red)}
.stock-search-error:empty{display:none}
.owner-stock-route .asset-switch{display:inline-flex}
.owner-stock-route .stock-search{gap:8px}
.owner-stock-route .stock-search input{width:210px;height:32px;padding:0 11px;font-size:.76rem}
.owner-stock-route .stock-search button{height:32px;padding:0 14px}
.owner-stock-route:not(.stock-data-ready) .strategy-switch{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.price{font-family:var(--mono);font-size:1.4rem;font-weight:600;letter-spacing:-.01em;color:var(--text);font-variant-numeric:tabular-nums}
.spot-label{font-family:var(--mono);font-size:.66rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.refresh{background:transparent;color:var(--muted);border:1px solid var(--line2);padding:4px 10px;border-radius:0;font-family:var(--mono);font-size:.66rem;cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.refresh:hover{color:var(--amber);border-color:var(--amber-dim)}
.market-meta{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin:4px 0 10px 1px;min-height:1em;letter-spacing:.03em}
.market-meta.delayed{color:var(--amber)}
.stock-empty{display:none;margin:24px 0;padding:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:.72rem;text-align:center}
.owner-stock-route.stock-search-empty .stock-empty{display:block}
.owner-stock-route.stock-search-empty .risk-note,
.owner-stock-route.stock-search-empty .action-banner,
.owner-stock-route.stock-search-empty .snapshot,
.owner-stock-route.stock-search-empty .filters,
.owner-stock-route.stock-search-empty #content,
.owner-stock-route.stock-search-empty .context-charts{display:none!important}
.owner-stock-route.stock-search-empty .price,
.owner-stock-route.stock-search-empty .spot-label,
.owner-stock-route.stock-search-empty .refresh{display:none}
/* ============ RISK NOTE / ACTION BANNER ============ */
.risk-note{display:none;margin:0 0 12px;padding:8px 11px;border:1px solid var(--amber-dim);border-left:2px solid var(--amber);background:var(--panel);color:var(--text2);font-size:.68rem;line-height:1.5}
.action-banner{padding:10px 12px;margin-bottom:12px;border:1px solid var(--line2);border-left:2px solid var(--muted);background:var(--panel)}
.action-banner .act-summary{display:flex;align-items:center;gap:12px}
.action-banner .act-badge{font-family:var(--mono);font-size:.66rem;font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:0;letter-spacing:.06em;text-transform:uppercase}
.action-banner .act-reason{font-size:.7rem;color:var(--text);line-height:1.45;flex:1}
.action-banner .act-logic{margin-top:10px;padding-top:9px;border-top:1px solid var(--line2)}
.action-banner .act-group+.act-group{margin-top:10px;padding-top:9px;border-top:1px solid var(--line2)}
.action-banner .act-logic-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:7px}
.action-banner .act-logic-title{font-family:var(--mono);font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.action-banner .act-model{font-family:var(--mono);font-size:.57rem;color:var(--faint);line-height:1.45;text-align:right}
.action-banner .act-evidence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line2)}
.action-banner .act-evidence.act-readings{grid-template-columns:repeat(5,minmax(0,1fr))}
.action-banner .act-evidence.act-steps{grid-template-columns:repeat(3,minmax(0,1fr))}
.action-banner .act-evidence-item{min-width:0;padding:10px 11px;border-right:1px solid var(--line2)}
.action-banner .act-evidence-item:last-child{border-right:0}
.action-banner .act-evidence-item span,.action-banner .act-evidence-item small{display:block;font-family:var(--mono)}
.action-banner .act-evidence-item span{font-size:.52rem;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.action-banner .act-evidence-item strong{display:block;margin-top:3px;color:var(--text);font-family:var(--mono);font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.action-banner .act-evidence-item small{margin-top:4px;color:var(--muted);font-size:.55rem;line-height:1.45}
.action-banner .act-evidence-item .act-impact{margin-top:8px;padding-top:7px;border-top:1px solid var(--line2);color:var(--text2)}
.action-banner .act-impact b{display:block;margin-bottom:3px;color:var(--muted);font-size:.55rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.action-banner .act-evidence-item.good strong{color:var(--green)}
.action-banner .act-evidence-item.warn strong{color:var(--amber)}
.action-banner .act-evidence-item.bad strong{color:var(--red)}
.action-banner .act-rule,.action-banner .act-boundary{margin-top:7px;font-size:.6rem;line-height:1.5;color:var(--text2)}
.action-banner .act-boundary{padding-left:8px;border-left:1px solid var(--amber);color:var(--muted)}
.action-banner .act-auxiliary{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-family:var(--mono);font-size:.56rem;line-height:1.45;color:var(--faint)}
.action-banner.sell{border-left-color:var(--green)}
.action-banner.sell .act-badge{background:transparent;color:var(--green);border:1px solid var(--green)}
.action-banner.wait{border-left-color:var(--amber)}
.action-banner.wait .act-badge{background:transparent;color:var(--amber);border:1px solid var(--amber)}
.action-banner.no{border-left-color:var(--red)}
.action-banner.no .act-badge{background:transparent;color:var(--red);border:1px solid var(--red)}
@media(min-width:851px){
  .action-banner .act-evidence.act-readings{grid-template-rows:repeat(4,auto)}
  .action-banner .act-evidence.act-readings>.act-evidence-item{display:grid;grid-row:1/5;grid-template-rows:subgrid}
  .action-banner .act-evidence.act-readings>.act-evidence-item>span{grid-row:1}
  .action-banner .act-evidence.act-readings>.act-evidence-item>strong{grid-row:2}
  .action-banner .act-evidence.act-readings>.act-evidence-item>small:not(.act-impact){grid-row:3}
  .action-banner .act-evidence.act-readings>.act-evidence-item>.act-impact{grid-row:4}
}
/* ============ PRICE CHART ============ */
.price-chart-panel{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:10px 12px 7px;margin-bottom:12px}
.price-chart-panel[hidden]{display:none}
.price-chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:5px}
.price-chart-head h2{font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--text);line-height:1.4;letter-spacing:.04em;text-transform:uppercase}
.price-chart-meta{display:block;font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:1px}
.timeframe-switch{display:inline-flex;flex-shrink:0;border:1px solid var(--line2);border-radius:0;overflow:hidden;background:transparent}
.timeframe-switch button{min-width:40px;height:24px;padding:0 8px;border:0;border-right:1px solid var(--line2);background:transparent;color:var(--muted);font-family:var(--mono);font-size:.62rem;font-weight:500;cursor:pointer}
.timeframe-switch button:last-child{border-right:0}
.timeframe-switch button:hover{color:var(--text);background:var(--panel2)}
.timeframe-switch button.on{background:transparent;color:var(--amber);box-shadow:inset 0 -1px 0 var(--amber)}
.price-chart-stage{height:320px;position:relative;min-width:0}
.price-chart-canvas{width:100%;height:100%}
.price-chart-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:.68rem;background:var(--panel);z-index:2}
.price-chart-state.error{color:var(--red)}
.price-chart-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:18px;padding-top:3px;font-family:var(--mono);font-size:.58rem;color:var(--faint)}
.price-chart-foot .stale{color:var(--amber)}
.tv-credit{color:var(--faint);text-decoration:none;white-space:nowrap}
.tv-credit:hover{color:var(--muted)}
/* ============ SECONDARY CHART GRID ============ */
.context-charts{margin-top:18px;border:1px solid var(--line2);background:var(--panel)}
.context-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.context-head h2{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.context-head p{margin-top:3px;color:var(--faint);font-family:var(--mono);font-size:.56rem}
.iv-range-switch{display:flex;border:1px solid var(--line2);flex:0 0 auto}
.iv-range-switch button{min-width:42px;height:27px;border:0;border-right:1px solid var(--line2);background:transparent;color:var(--muted);font-family:var(--mono);font-size:.61rem;cursor:pointer}
.iv-range-switch button:last-child{border-right:0}
.iv-range-switch button.on{background:var(--amber-dim);color:var(--amber)}
.iv-metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--line2)}
.iv-metric{min-width:0;padding:9px 11px;border-right:1px solid var(--line2)}
.iv-metric:last-child{border-right:0}
.iv-metric span{display:block;color:var(--faint);font-family:var(--mono);font-size:.55rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-metric strong{display:block;margin-top:3px;color:var(--text);font-family:var(--mono);font-size:.84rem;font-weight:600;font-variant-numeric:tabular-nums}
.iv-metric strong.high{color:var(--green)}
.iv-metric strong.low{color:var(--red)}
.iv-context-note{padding:7px 12px 0;color:var(--muted);font-family:var(--mono);font-size:.58rem;line-height:1.45}
.iv-context-state{padding:18px 12px;color:var(--muted);font-family:var(--mono);font-size:.65rem;text-align:center}
.context-charts .chart-grid{margin:0;padding:10px 12px}
.chart-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.chart-grid.count-1{grid-template-columns:1fr}
.chart-grid.count-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:9px 11px;min-width:0}
.chart-box h3{font-family:var(--mono);font-size:.68rem;color:var(--text2);font-weight:600;margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
.chart-box canvas{width:100%!important;height:190px!important}
/* ============ TOOLTIP ============ */
.tip{position:relative;cursor:help;border-bottom:1px dashed var(--faint)}
.tip .tt{display:none}
.hover-tooltip{visibility:hidden;position:fixed;z-index:1000;left:0;top:0;width:min(260px,calc(100vw - 24px));padding:7px 9px;border:1px solid var(--line3);border-radius:0;background:var(--panel3);color:var(--text);font-size:.66rem;font-weight:400;line-height:1.45;text-align:left;white-space:normal;overflow-wrap:anywhere;pointer-events:none;opacity:0;transition:opacity .12s}
.hover-tooltip.on{visibility:visible;opacity:1}
/* ============ SNAPSHOT & TABLE ============ */
.snapshot{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:10px 12px;margin-bottom:12px}
.snapshot h2{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:.72rem;color:var(--text);font-weight:600;margin-bottom:7px;letter-spacing:.04em;text-transform:uppercase}
.snapshot .meta{font-size:.6rem;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.snapshot select{background:transparent;border:1px solid var(--line2);color:var(--text);padding:2px 6px;border-radius:0;font-family:var(--mono);font-size:.72rem;font-weight:600}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{color:var(--muted);font-family:var(--mono);font-size:.62rem;font-weight:500;text-align:right;padding:5px 8px;border-bottom:1px solid var(--line2);letter-spacing:.04em;text-transform:uppercase}
td{padding:5px 8px;text-align:right;font-family:var(--mono);font-size:.72rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
.cell-note{display:block;font-size:.56rem;color:var(--muted);font-weight:400;margin-top:1px}
/* ============ DEPTH & QUOTES ============ */
.quote-depth{display:inline-block;white-space:nowrap;color:var(--text);font-weight:500;font-family:var(--mono)}
button.quote-depth{padding:1px 0;border:0;border-bottom:1px dotted var(--faint);background:transparent;font:inherit;font-weight:500;line-height:1.25;cursor:pointer}
button.quote-depth.idle{color:var(--muted);font-weight:400}
button.quote-depth:hover{color:var(--amber);border-color:var(--muted)}
button.quote-depth:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
button.quote-depth[aria-disabled="true"]{cursor:wait;opacity:.65}
.quote-depth.stale{color:var(--amber)}
.quote-detail-toggle{display:inline-flex;align-items:center;gap:4px;margin-top:3px;padding:1px 0;border:0;border-bottom:1px dotted var(--faint);background:transparent;color:var(--muted);font-size:.56rem;cursor:pointer;font-family:var(--mono);letter-spacing:.03em}
.quote-detail-toggle:hover{color:var(--text);border-color:var(--muted)}
.quote-detail-toggle.warning{color:var(--amber);border-color:var(--amber-dim);font-weight:600}
.quote-detail-toggle.danger{color:var(--red);border-color:var(--red);font-weight:600}
.quote-detail-chevron{display:inline-block;transition:transform .15s ease}
.quote-detail-toggle[aria-expanded="true"] .quote-detail-chevron{transform:rotate(90deg)}
.quote-detail-row[hidden]{display:none}
.quote-detail-row td{padding:0;border-bottom:1px solid var(--line2);background:var(--panel2);text-align:left}
.quote-detail-inner{padding:9px 11px;white-space:normal}
.quote-detail-grid{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:8px 18px}
.quote-detail-item span{display:block;color:var(--muted);font-family:var(--mono);font-size:.56rem;margin-bottom:2px;letter-spacing:.04em;text-transform:uppercase}
.quote-detail-item strong{display:block;color:var(--text);font-family:var(--mono);font-size:.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.quote-detail-item strong.warning{color:var(--amber)}
.quote-detail-item strong.danger{color:var(--red)}
.quote-detail-note{margin-top:7px;color:var(--muted);font-size:.58rem;line-height:1.45;white-space:normal}
/* ============ FILTERS ============ */
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.filters label{font-family:var(--mono);font-size:.64rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.filters select,.filters input{background:transparent;border:1px solid var(--line2);color:var(--text);padding:4px 7px;border-radius:0;font-family:var(--mono);font-size:.7rem}
.filters input{width:76px}
.filter-range{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}

.owner-position-item{display:grid;width:100%;grid-template-columns:minmax(0,1.2fr) minmax(80px,.7fr) minmax(92px,.7fr) minmax(75px,.6fr);grid-template-areas:"contract apr pnl dte" "state state state state";gap:8px 12px;margin:0 0 4px;padding:11px 12px;border:1px solid transparent;border-radius:0;background:transparent;color:var(--text);text-align:left;cursor:pointer;transition:background-color .12s ease,border-color .12s ease}

.owner-research-card summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;cursor:pointer;font-family:var(--mono);font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;min-height:38px}

.owner-research-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line2);border-top:1px solid var(--line2)}
.owner-research-grid>div{background:var(--panel2);padding:9px}
.owner-research-grid span{display:block;color:var(--muted);font-family:var(--mono);font-size:.54rem;margin-bottom:3px;letter-spacing:.04em;text-transform:uppercase}
.owner-research-grid strong{font-family:var(--mono);font-size:.74rem;font-weight:600;font-variant-numeric:tabular-nums}
.owner-research-table{overflow-x:auto;padding:10px 12px 0}
.owner-research-table table{min-width:520px}
.owner-research-note,.owner-form-note{padding:9px 12px 11px;color:var(--muted);font-size:.58rem;line-height:1.5;font-family:var(--mono)}
/* ============ STRESS CONTROLS ============ */
.owner-stress-controls{display:grid;grid-template-columns:220px minmax(220px,1fr);align-items:center;gap:18px;padding:12px 12px 4px}
.owner-stress-controls>div{display:flex;align-items:center;justify-content:space-between;gap:12px}
.owner-stress-controls span{color:var(--muted);font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase}
.owner-stress-value{display:inline-flex;align-items:center;gap:4px;color:var(--amber);font-weight:600;font-family:var(--mono)}
.owner-stress-value span{color:var(--amber);font-size:.78rem}
.owner-stress-value input{width:66px;min-height:30px;padding:4px 6px;border:1px solid var(--line3);border-radius:0;background:var(--panel);color:var(--amber);font-family:var(--mono);font-size:.78rem;font-weight:600;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.owner-stress-value input:focus{outline:1px solid var(--amber);outline-offset:1px}
.owner-stress-controls>input[type="range"]{width:100%;accent-color:var(--amber);cursor:pointer}
/* ============ OWNER DIALOG ============ */
.owner-dialog{width:min(580px,calc(100vw - 24px));border:1px solid var(--line3);border-radius:0;background:var(--panel);color:var(--text);padding:0;box-shadow:none}
.owner-dialog::backdrop{background:rgba(4,6,10,.8)}
.owner-dialog form{padding:18px}
.owner-dialog-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.owner-dialog-head h2{font-family:var(--mono);font-size:.92rem;margin-top:4px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.owner-dialog-close{border:0;background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;min-width:32px;min-height:32px}
.owner-dialog-close:hover{color:var(--amber)}
.owner-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.owner-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.owner-dialog-actions button,.owner-dialog-close{min-height:36px}
.owner-dialog-error{margin-top:9px}
/* Position entry is a compact workflow, not a full-page data form. */
.owner-entry-dialog{position:fixed;inset:0;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 32px);margin:auto;overflow:hidden;border-color:var(--line3);border-top:2px solid var(--amber);background:#101319;box-shadow:0 24px 72px rgba(0,0,0,.48);outline:1px solid var(--line3);outline-offset:-1px}
.owner-entry-dialog.owner-closed-dialog{width:min(650px,calc(100vw - 32px));overflow-y:auto}
.owner-entry-dialog:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.owner-entry-dialog::backdrop{background:rgba(3,5,8,.82);backdrop-filter:blur(2px)}
.owner-entry-dialog form{padding:0}
.owner-entry-dialog .owner-dialog-head{align-items:center;margin:0;padding:18px 20px 16px;border-bottom:1px solid var(--line2)}
.owner-entry-dialog .owner-dialog-head h2{margin-top:3px;font-family:var(--sans);font-size:1.06rem;font-weight:650;letter-spacing:-.01em;text-transform:none}
.owner-entry-dialog .owner-kicker{font-size:.56rem;letter-spacing:.16em}
.owner-dialog-subtitle{margin-top:5px;color:var(--muted);font-size:.65rem;line-height:1.45}
.owner-entry-dialog .owner-dialog-close{display:grid;place-items:center;width:34px;height:34px;min-width:34px;min-height:34px;border:1px solid transparent;color:var(--muted);font-family:var(--sans);font-size:1.25rem;line-height:1}
.owner-entry-dialog .owner-dialog-close:hover{border-color:var(--line2);background:var(--panel2);color:var(--text)}
.owner-entry-dialog .owner-form-grid{padding:18px 20px 17px;gap:14px 12px}
.owner-entry-dialog .owner-form-grid label{gap:7px;color:var(--text2);font-family:var(--sans);font-size:.68rem;font-weight:500;letter-spacing:.01em;text-transform:none}
.owner-entry-dialog .owner-form-grid input,.owner-entry-dialog .owner-form-grid select,.owner-entry-dialog .owner-form-grid textarea{border-color:var(--line2);background:var(--panel2);padding-left:12px;padding-right:12px;font-size:.78rem}
.owner-entry-dialog .owner-form-grid input,.owner-entry-dialog .owner-form-grid select{height:42px}
.owner-entry-dialog .owner-form-grid input:hover,.owner-entry-dialog .owner-form-grid select:hover,.owner-entry-dialog .owner-form-grid textarea:hover{border-color:var(--line3)}
.owner-entry-dialog .owner-form-grid input:focus,.owner-entry-dialog .owner-form-grid select:focus,.owner-entry-dialog .owner-form-grid textarea:focus{border-color:var(--amber);box-shadow:0 0 0 1px rgba(212,160,36,.18)}
.owner-entry-dialog .owner-form-grid input[readonly],.owner-entry-dialog .owner-form-grid select:disabled{border-style:dashed;color:var(--muted);cursor:not-allowed;opacity:.78}
.owner-entry-dialog .owner-form-wide{grid-column:1/-1}
.owner-open-context{grid-column:1/-1;padding:12px;border:1px solid var(--line2);border-left:2px solid var(--amber-dim);background:var(--panel3)}
.owner-open-context>div:first-child,.owner-open-context-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.owner-open-context span{color:var(--muted);font-family:var(--mono);font-size:.55rem;letter-spacing:.05em;text-transform:uppercase}
.owner-open-context strong{color:var(--text);font-family:var(--mono);font-size:.65rem;font-weight:600}
.owner-open-context-metrics{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.owner-open-context-metrics span{white-space:nowrap}
.owner-open-context-metrics b{margin-left:3px;color:var(--text);font-weight:600}
.owner-open-context p{margin-top:9px;color:var(--text2);font-family:var(--mono);font-size:.6rem;line-height:1.4}
.owner-open-context>small{display:block;margin-top:7px;color:var(--faint);font-family:var(--mono);font-size:.53rem;line-height:1.45}
.owner-entry-dialog .owner-form-note{margin:0 20px;padding:11px 0 13px;border-top:1px solid var(--line);color:var(--muted);font-family:var(--sans);font-size:.62rem;line-height:1.5}
.owner-entry-dialog .owner-dialog-error{min-height:0;margin:0 20px}
.owner-entry-dialog .owner-dialog-error:not(:empty){margin-bottom:12px;padding:9px 10px;border-left:2px solid var(--red);background:rgba(199,84,84,.08)}
.owner-entry-dialog .owner-dialog-actions{margin:0;padding:14px 20px 17px;border-top:1px solid var(--line2);background:rgba(255,255,255,.012)}
.owner-entry-dialog .owner-dialog-actions button{min-width:88px;min-height:38px}
.owner-entry-dialog .owner-dialog-actions .owner-primary{min-width:108px;background:var(--amber);color:var(--bg)}
.owner-entry-dialog .owner-dialog-actions .owner-primary:hover{background:var(--amber-bright);border-color:var(--amber-bright)}
.owner-closed-preview{display:grid;grid-template-columns:145px 150px minmax(0,1fr);align-items:center;gap:12px;margin:0 20px 16px;padding:11px 12px;border:1px solid var(--line2);background:var(--panel3)}
.owner-closed-preview span{color:var(--muted);font-family:var(--mono);font-size:.56rem;letter-spacing:.05em;text-transform:uppercase}
.owner-closed-preview strong{font-family:var(--mono);font-size:.92rem;font-weight:600;font-variant-numeric:tabular-nums}
.owner-closed-preview small{color:var(--faint);font-family:var(--mono);font-size:.55rem;line-height:1.4}
.owner-closed-preview.good strong{color:var(--green)}
.owner-closed-preview.bad strong{color:var(--red)}
.owner-closed-preview.muted strong{color:var(--muted)}
/* ============ OWNER CHAIN CELL ============ */
.owner-chain-action{text-align:right!important}
.owner-holding-badge{display:inline-block;margin-right:7px;padding:2px 6px;background:transparent;color:var(--green);border:1px solid var(--green);font-family:var(--mono);font-size:.56rem;font-weight:600;letter-spacing:.05em}
.owner-link{border:0;border-bottom:1px dotted var(--faint);background:transparent;color:var(--muted);font-family:var(--mono);font-size:.6rem;cursor:pointer;margin-left:8px;padding:1px 0;letter-spacing:.03em}
.owner-link:first-child{margin-left:0}
.owner-link:hover{color:var(--amber);border-color:var(--amber-dim)}
.owner-link:disabled{opacity:.4;cursor:not-allowed;border-color:transparent}
/* ============ OWNER U.S. CANDIDATE FEED ============ */
.owner-us-rankings-page{display:none;min-width:0}
.owner-rankings-route main.wrap>:not(.owner-us-rankings-page){display:none!important}
.owner-rankings-route .owner-us-rankings-page{display:block!important}
.owner-rankings-route .wrap{max-width:1480px;padding:18px 20px 40px}
.owner-rankings-head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;padding:4px 0 16px;border-bottom:1px solid var(--line2)}
.owner-rankings-head h2{margin:5px 0 5px;font-family:var(--mono);font-size:1.18rem;font-weight:600;letter-spacing:.01em}
.owner-rankings-head p{max-width:720px;color:var(--muted);font-family:var(--mono);font-size:.64rem;line-height:1.55}
.owner-rankings-actions{display:flex;align-items:center;gap:8px;flex:none}
.owner-rankings-actions a.owner-quiet{display:inline-flex;align-items:center;text-decoration:none}
.owner-rankings-source{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:14px;border:1px solid var(--line2);background:var(--line2)}
.owner-rankings-source>div{min-width:0;min-height:70px;padding:11px 13px;background:var(--panel)}
.owner-rankings-source span{display:block;color:var(--faint);font-family:var(--mono);font-size:.54rem;letter-spacing:.06em;text-transform:uppercase}
.owner-rankings-source strong{display:block;margin-top:7px;color:var(--text2);font-family:var(--mono);font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.owner-rankings-source small{display:block;margin-top:3px;color:var(--muted);font-family:var(--mono);font-size:.54rem;line-height:1.35}
.owner-rankings-source .warn strong{color:var(--amber)}
.owner-rankings-source .bad strong{color:var(--red)}
.owner-rankings-controls{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(150px,.8fr) minmax(180px,1fr) minmax(0,2fr);align-items:end;gap:12px;padding:14px 0}
.owner-rankings-controls label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-family:var(--mono);font-size:.56rem;letter-spacing:.05em;text-transform:uppercase}
.owner-rankings-controls select,.owner-rankings-controls input{width:100%;height:36px;border:1px solid var(--line2);border-radius:0;background:var(--panel);color:var(--text);padding:0 10px;font-family:var(--mono);font-size:.7rem}
.owner-rankings-controls select:focus,.owner-rankings-controls input:focus{outline:none;border-color:var(--amber-dim)}
.owner-rankings-control-note{align-self:center;padding-top:13px;color:var(--faint);font-family:var(--mono);font-size:.58rem;line-height:1.45;text-align:right}
.owner-rankings-state{min-height:190px;border-top:2px solid var(--line3);background:var(--panel)}
.owner-rankings-message{display:flex;align-items:baseline;gap:14px;padding:28px 18px;border:1px solid var(--line2);border-top:0;color:var(--muted);font-family:var(--mono);font-size:.64rem;line-height:1.5}
.owner-rankings-message strong{color:var(--text2);font-size:.75rem;white-space:nowrap}
.owner-rankings-message.bad{border-left:2px solid var(--red)}
.owner-rankings-table{border:0 solid var(--line2);border-width:0 1px 1px}
.owner-rankings-table-head,.owner-rankings-row{display:grid;grid-template-columns:minmax(110px,.8fr) minmax(190px,1.2fr) 72px minmax(140px,.9fr) minmax(120px,.75fr) minmax(125px,.85fr) minmax(180px,1.15fr);align-items:center;gap:12px}
.owner-rankings-table-head{min-height:34px;padding:0 13px;border-bottom:1px solid var(--line2);background:var(--panel2);color:var(--faint);font-family:var(--mono);font-size:.52rem;letter-spacing:.06em;text-transform:uppercase}
.owner-rankings-row{min-height:72px;padding:10px 13px;border-bottom:1px solid var(--line);background:var(--panel)}
.owner-rankings-row:last-child{border-bottom:0}
.owner-rankings-row:hover{background:var(--panel2)}
.owner-rankings-row>div{min-width:0}
.owner-rankings-row strong{display:block;color:var(--text2);font-family:var(--mono);font-size:.7rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.owner-rankings-row small{display:block;margin-top:3px;color:var(--muted);font-family:var(--mono);font-size:.54rem;line-height:1.35;overflow-wrap:anywhere}
.owner-ranking-ticker strong{color:var(--amber);font-size:.83rem}
.owner-ranking-score strong{font-size:.88rem;color:var(--green)}
.owner-ranking-capital strong{color:var(--text)}
.owner-ranking-warning{margin-top:12px;padding:9px 11px;border-left:2px solid var(--amber);background:rgba(217,154,48,.055);color:var(--muted);font-family:var(--mono);font-size:.58rem;line-height:1.55}
.owner-ranking-warning strong{color:var(--amber);font-weight:600}
/* ============ OWNER DECISION JOURNAL ============ */
.owner-review-page{display:none;min-width:0}
.owner-review-route main.wrap>:not(.owner-review-page){display:none}
.owner-review-route .owner-review-page{display:block}
.owner-review-route .wrap{max-width:1480px;padding:18px 20px 40px}
.owner-review-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:4px 0 16px;border-bottom:1px solid var(--line2)}
.owner-review-head h2{margin:5px 0 4px;font-family:var(--mono);font-size:1.18rem;font-weight:600}
.owner-review-head p{color:var(--muted);font-family:var(--mono);font-size:.64rem;line-height:1.5}
.owner-review-head a{display:inline-flex;align-items:center;text-decoration:none}
.owner-review-summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;margin-top:14px;border:1px solid var(--line2);background:var(--line2)}
.owner-review-metric{min-width:0;min-height:82px;padding:12px;background:var(--panel)}
.owner-review-metric span,.owner-review-row span,.owner-review-snapshot-grid span{display:block;color:var(--faint);font-family:var(--mono);font-size:.53rem;letter-spacing:.05em;text-transform:uppercase}
.owner-review-metric strong{display:block;margin-top:8px;font-family:var(--mono);font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums}
.owner-review-metric small{display:block;margin-top:4px;color:var(--muted);font-family:var(--mono);font-size:.53rem}
.owner-review-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.owner-review-group{border:1px solid var(--line2);background:var(--panel)}
.owner-review-group h3{padding:10px 12px;border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.owner-review-group>div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
.owner-review-bucket{min-width:0;padding:10px 12px;background:var(--panel2)}
.owner-review-bucket strong{display:block;color:var(--text2);font-family:var(--mono);font-size:.7rem;font-weight:600}
.owner-review-bucket span,.owner-review-bucket small{display:block;margin-top:4px;color:var(--muted);font-family:var(--mono);font-size:.54rem;line-height:1.35}
.owner-review-filters{display:grid;grid-template-columns:repeat(3,minmax(130px,180px)) 1fr;align-items:end;gap:10px;margin-top:14px;padding:11px 12px;border:1px solid var(--line2);background:var(--panel2)}
.owner-review-filters label,.owner-review-compare form label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-family:var(--mono);font-size:.55rem;letter-spacing:.04em;text-transform:uppercase}
.owner-review-filters select,.owner-review-compare select,.owner-review-compare textarea{width:100%;border:1px solid var(--line2);border-radius:0;background:var(--panel);color:var(--text);font-family:var(--mono)}
.owner-review-filters select{height:34px;padding:0 9px}
.owner-review-filters>strong{justify-self:end;padding-bottom:8px;color:var(--amber);font-family:var(--mono);font-size:.68rem}
.owner-review-list{margin-top:10px;border-top:2px solid var(--line3)}
.owner-review-row{border:0 solid var(--line2);border-width:0 1px 1px;background:var(--panel)}
.owner-review-row>header{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:13px 15px}
.owner-review-row>header>div:last-child{text-align:right}
.owner-review-row>header strong{display:block;margin-top:4px;font-family:var(--mono);font-size:.78rem;font-weight:600}
.owner-review-row>header small{display:block;margin-top:3px;color:var(--muted);font-family:var(--mono);font-size:.54rem}
.owner-review-row .good strong{color:var(--green)}.owner-review-row .bad strong{color:var(--red)}.owner-review-row .muted strong{color:var(--muted)}
.owner-review-row details{border-top:1px solid var(--line)}
.owner-review-row summary{display:flex;align-items:center;justify-content:space-between;min-height:38px;padding:0 15px;cursor:pointer;color:var(--amber);font-family:var(--mono);font-size:.6rem}
.owner-review-row summary small{color:var(--muted)}
.owner-review-compare{display:grid;grid-template-columns:1fr 1fr;gap:1px;border-top:1px solid var(--line2);background:var(--line2)}
.owner-review-compare>section,.owner-review-compare>form{min-width:0;padding:14px;background:var(--panel2)}
.owner-review-compare h4{margin-bottom:10px;color:var(--text2);font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.owner-review-snapshot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
.owner-review-snapshot-grid>div{min-width:0;padding:9px;background:var(--panel)}
.owner-review-snapshot-grid strong{display:block;margin-top:4px;font-family:var(--mono);font-size:.67rem;font-weight:600;overflow-wrap:anywhere}
.owner-review-snapshot-grid>div small{display:block;margin-top:3px;color:var(--faint);font-family:var(--mono);font-size:.52rem}
.owner-review-snapshot-grid>p{grid-column:1/-1;margin:0;padding:10px;background:var(--panel);color:var(--muted);font-family:var(--mono);font-size:.6rem;line-height:1.5;white-space:pre-wrap}
.owner-review-snapshot-grid>p span{margin-bottom:5px}
.owner-review-empty-snapshot{padding:14px;border:1px solid var(--line2);color:var(--muted);font-family:var(--mono);font-size:.6rem}
.owner-review-empty-snapshot strong{display:block;margin-bottom:5px;color:var(--text2)}
.owner-review-compare form{display:flex;flex-direction:column;gap:12px}
.owner-review-compare select{height:36px;padding:0 9px}
.owner-review-compare textarea{min-height:118px;padding:9px;line-height:1.5;resize:vertical}
.owner-review-save{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:auto}
.owner-review-save span{color:var(--green)}
.owner-close-snapshot{margin:0 22px 14px;padding:13px;border:1px solid var(--line2);background:var(--panel2)}
.owner-close-snapshot>div:first-child{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.owner-close-snapshot>div:first-child strong{font-family:var(--mono);font-size:.72rem}
.owner-reason-field{border:1px solid var(--line2);padding:0;background:var(--panel2)}
.owner-reason-field summary{padding:9px 11px;cursor:pointer;color:var(--amber);font-family:var(--mono);font-size:.6rem}
.owner-reason-field label{padding:0 11px 11px}
.owner-form-grid label small{display:block;margin-top:5px;color:var(--faint);font-family:var(--mono);font-size:.52rem;line-height:1.35;text-transform:none;letter-spacing:0}
/* ============ OWNER POSITIONS ROUTE OVERRIDES ============ */
.owner-positions-route main.wrap>:not(.owner-account-bar):not(.owner-positions-page){display:none!important}
.owner-positions-route .owner-positions-page{display:block!important}
.owner-positions-route .owner-entry-card{display:flex!important}
/* ============ MISC OWNER ============ */
.owner-route{color-scheme:dark}
.owner-route body{background:var(--bg)}
.owner-positions-route .wrap{max-width:1480px;padding:14px 20px 40px}
.owner-expired{background:rgba(199,84,84,.06)}
.owner-expired-tag{display:block;width:max-content;margin-top:3px;padding:1px 5px;background:transparent;color:var(--red);border:1px solid var(--red);font-family:var(--mono);font-size:.54rem;letter-spacing:.05em}
.owner-status{display:inline-block;font-weight:600;font-family:var(--mono);font-size:.62rem;letter-spacing:.04em}
.owner-reason{display:block;max-width:280px;margin-top:3px;color:var(--muted);font-size:.58rem;line-height:1.4;white-space:normal;font-family:var(--mono)}
/* ============ RESPONSIVE: <=1100px ============ */
@media(max-width:1100px){

function tip(label,copy){

function tooltipPlacement(
  anchorRect,
  tooltipRect,
  viewportWidth,
  viewportHeight,
  margin=12,
  gap=8
){
  const minLeft=margin+tooltipRect.width/2;
  const maxLeft=Math.max(
    minLeft,
    viewportWidth-margin-tooltipRect.width/2
  );
  const left=Math.min(
    maxLeft,
    Math.max(minLeft,anchorRect.left+anchorRect.width/2)
  );
  const above=anchorRect.top-tooltipRect.height-gap;
  const below=anchorRect.bottom+gap;
  const maxTop=Math.max(
    margin,
    viewportHeight-margin-tooltipRect.height
  );
  const preferredTop=above>=margin?above:below;
  const top=Math.min(maxTop,Math.max(margin,preferredTop));
  return {left,top};
}

function resetFloatingTooltipPosition(tooltip){
  ["left","right","top","bottom","transform"].forEach(
    property=>tooltip.style.removeProperty(property)
  );
}

function positionHoverTooltip(target){
  const tooltip=$("hoverTooltip");
  if(!target?.isConnected||!tooltip.classList.contains("on")){
    if(target&&!target.isConnected) hideHoverTooltip(target);
    return;
  }
  if(window.matchMedia("(max-width:600px)").matches){
    resetFloatingTooltipPosition(tooltip);
    return;
  }
  const placement=tooltipPlacement(
    target.getBoundingClientRect(),
    tooltip.getBoundingClientRect(),
    window.innerWidth,
    window.innerHeight
  );
  tooltip.style.left=`${placement.left}px`;
  tooltip.style.right="auto";
  tooltip.style.top=`${placement.top}px`;
  tooltip.style.bottom="auto";
  tooltip.style.transform="translateX(-50%)";
}

function showHoverTooltip(target){
  const source=target?.querySelector(".tt");
  const tooltip=$("hoverTooltip");
  if(!source||!tooltip) return;
  if(activeHoverTip&&activeHoverTip!==target){
    activeHoverTip.removeAttribute("aria-describedby");
  }
  activeHoverTip=target;
  tooltip.textContent=source.textContent;
  tooltip.classList.add("on");
  tooltip.setAttribute("aria-hidden","false");
  target.setAttribute("aria-describedby","hoverTooltip");
  positionHoverTooltip(target);
}

function hideHoverTooltip(target=activeHoverTip){
  if(target&&activeHoverTip&&target!==activeHoverTip) return;
  const tooltip=$("hoverTooltip");
  if(activeHoverTip){
    activeHoverTip.removeAttribute("aria-describedby");
  }
  activeHoverTip=null;
  tooltip.classList.remove("on");
  tooltip.setAttribute("aria-hidden","true");
  resetFloatingTooltipPosition(tooltip);
}

function hideDetachedHoverTooltip(
  target=activeHoverTip,
  hide=hideHoverTooltip
){
  if(!target||target.isConnected) return false;
  hide(target);
  return true;
}

function releaseHoverTooltip(target){
  requestAnimationFrame(()=>{
    if(
      target===activeHoverTip
      &&target.isConnected
      &&(target.matches(":hover")||document.activeElement===target)
    ) return;
    hideHoverTooltip(target);
  });
}

function boundedPriceLogicalRange(range,candleCount){
  if(
    !range
    || !Number.isFinite(range.from)
    || !Number.isFinite(range.to)
    || candleCount<2
  ) return null;
  const first=0;
  const last=candleCount-1;
  const width=range.to-range.from;
  if(width<=0) return null;
  if(width>=last-first) return {from:first,to:last};
  let from=range.from;
  let to=range.to;
  if(from<first){
    to+=first-from;
    from=first;
  }
  if(to>last){
    from-=to-last;
    to=last;
  }
  return {from,to};
}

  priceResizeObserver=null;
  if(priceChart&&priceVisibleRangeHandler){
    priceChart.timeScale().unsubscribeVisibleLogicalRangeChange(priceVisibleRangeHandler);
  }
  priceVisibleRangeHandler=null;
  if(priceChart) priceChart.remove();
  priceChart=null;
  priceSeries=null;
  priceChartIdentity=null;
  $("priceChart").replaceChildren();
}

function renderPriceChart(payload){
  if(!globalThis.LightweightCharts?.createChart){
    destroyPriceChart();
    setPriceChartState("error");
    return;
  }
  const payloadMarket=["us_equity","us_etf"].includes(payload.asset_class)?"us_stock":"crypto";
  const identity=`${payloadMarket}:${payload.symbol||payload.asset}:${payload.timeframe}`;
  const isNew=priceChartIdentity!==identity||!priceChart||!priceSeries;
  const container=$("priceChart");
  if(isNew){
    destroyPriceChart();
    const precision=Number(payload.price_decimals??2);
    priceChart=LightweightCharts.createChart(container,{
      width:Math.max(1,container.clientWidth),
      height:Math.max(240,container.clientHeight),
      layout:{
        background:{type:LightweightCharts.ColorType.Solid,color:"#1e222d"},
        textColor:"#787b86",
        fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',
        fontSize:11
      },
      grid:{
        vertLines:{color:"#2a2e3955"},
        horzLines:{color:"#2a2e3955"}
      },
      crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
      rightPriceScale:{borderColor:"#2a2e39",scaleMargins:{top:.08,bottom:.08}},
      timeScale:{
        borderColor:"#2a2e39",
        timeVisible:!["1d","1w"].includes(payload.timeframe),
        secondsVisible:false,
        rightOffset:3,
        barSpacing:7,
        minBarSpacing:2,
        fixLeftEdge:false,
        fixRightEdge:false,
        lockVisibleTimeRangeOnResize:true
      },
      localization:{locale:_lang==="zh"?"zh-CN":"en-US"},
      handleScroll:true,
      handleScale:true
    });
    priceSeries=priceChart.addCandlestickSeries({
      upColor:"#26a69a",
      downColor:"#ef5350",
      borderUpColor:"#26a69a",
      borderDownColor:"#ef5350",
      wickUpColor:"#26a69a",
      wickDownColor:"#ef5350",
      priceFormat:{
        type:"price",
        precision,
        minMove:Math.pow(10,-precision)
      }
    });
    priceChartIdentity=identity;
    priceResizeObserver=new ResizeObserver(entries=>{
      const rect=entries[0]?.contentRect;
      if(rect&&priceChart){
        priceChart.applyOptions({
          width:Math.max(1,Math.floor(rect.width)),
          height:Math.max(1,Math.floor(rect.height))
        });
      }
    });
    priceResizeObserver.observe(container);
  }
  priceSeries.setData(payload.candles);
  priceChart.applyOptions({
    localization:{locale:_lang==="zh"?"zh-CN":"en-US"}
  });
  const timeScale=priceChart.timeScale();
  if(priceVisibleRangeHandler){
    timeScale.unsubscribeVisibleLogicalRangeChange(priceVisibleRangeHandler);
  }
  let guardingVisibleRange=false;
  const chartForRangeGuard=priceChart;
  const candleCount=payload.candles.length;
  priceVisibleRangeHandler=range=>{
    if(guardingVisibleRange||priceChart!==chartForRangeGuard) return;
    const bounded=boundedPriceLogicalRange(range,candleCount);
    if(
      !bounded
      || (
        Math.abs(bounded.from-range.from)<1e-6
        && Math.abs(bounded.to-range.to)<1e-6
      )
    ) return;
    guardingVisibleRange=true;
    try{
      timeScale.setVisibleLogicalRange(bounded);
    }finally{
      guardingVisibleRange=false;
    }
  };
  timeScale.subscribeVisibleLogicalRangeChange(priceVisibleRangeHandler);
  if(isNew&&candleCount>1){
    const last=candleCount-1;
    const visibleBars=Math.min(
      candleCount,
      PRICE_INITIAL_VISIBLE_BARS[payload.timeframe]||PRICE_INITIAL_VISIBLE_BARS["1h"]
    );
    timeScale.setVisibleLogicalRange({
      from:Math.max(0,last-visibleBars),
      to:last
    });
  }
  renderPriceChartCopy(payload);
  setPriceChartState("ready");
}

async function loadPriceChart(){
  if(isStockMode()) return;
  const market=currentMarket;
  const symbol=currentSymbol();
  const key=selectionKey();
  const timeframe=currentTimeframe;
  const identity=`${market}:${symbol}:${timeframe}`;
  const version=++priceRequestVersion;
  if(priceRequestController) priceRequestController.abort();
  priceRequestController=new AbortController();
  const {signal}=priceRequestController;
  if(priceChartIdentity!==identity) setPriceChartState("loading");
  try{
    const response=await fetch(priceApiUrl(symbol,timeframe),{
      signal,
      cache:"no-store"
    });
    if(version!==priceRequestVersion||key!==selectionKey()||timeframe!==currentTimeframe) return;
    if(!response.ok){
      let detail="";
      try{detail=(await response.json()).error||""}catch(_){}
      throw new Error(detail||`HTTP ${response.status}`);
    }
    const payload=await response.json();
    if(
      version!==priceRequestVersion
      ||key!==selectionKey()
      ||timeframe!==currentTimeframe
      ||(payload.symbol||payload.asset)!==symbol
      ||payload.timeframe!==timeframe
    ) return;
    PRICE_DATA=payload;
    if(!payload.candles?.length){
      destroyPriceChart();
      renderPriceChartCopy(payload);
      setPriceChartState("empty");
      return;
    }
    renderPriceChart(payload);
  }catch(error){
    if(
      error.name==="AbortError"
      ||version!==priceRequestVersion
      ||key!==selectionKey()
      ||timeframe!==currentTimeframe
    ) return;
    PRICE_DATA=null;
    destroyPriceChart();
    renderPriceChartCopy();
    setPriceChartState("error");
  }
}

function normalizeStockSymbol(value){
  const symbol=String(value||"").trim().toUpperCase();
  return symbol.length<=10&&/^[A-Z][A-Z0-9]*(?:[.-][A-Z0-9]+)?$/.test(symbol)
    ?symbol
    :null;
}

function syncOwnerStockUrl(symbol){
  if(!/\/(?:owner\/)?(?:us-options|us-rankings)\/?$/.test(window.location.pathname)) return;
  const url=new URL(window.location.href);
  url.searchParams.set("ticker",symbol);
  window.history.replaceState(null,"",url);
  const sellPutUrl=new URL(url);
  sellPutUrl.searchParams.delete("strategy");
  const buyCallUrl=new URL(url);
  buyCallUrl.searchParams.set("strategy","buy_call");
  const coveredCallUrl=new URL(url);
  coveredCallUrl.searchParams.set("strategy","covered_call");
  $("sellPutNav").href=`${sellPutUrl.pathname}${sellPutUrl.search}`;
  $("buyCallNav").href=`${buyCallUrl.pathname}${buyCallUrl.search}`;
  $("coveredCallNav").href=`${coveredCallUrl.pathname}${coveredCallUrl.search}`;
}

  const vrp=metrics.vrp===null||metrics.vrp===undefined?"—":`${Number(metrics.vrp)>=0?"+":""}${Number(metrics.vrp).toFixed(1)}`;
  const translations={
    insufficient_history:{
      label:"Timing unavailable",
      reason:`Deribit does not yet publish ${asset} DVOL history, so the option chain is shown without an entry-timing conclusion.`
    },
    volatility_unavailable:{
      label:"Data unavailable",
      reason:`${asset} volatility data is unavailable; no timing conclusion is allowed.`
    },
    iv_rv_unavailable:{
      label:"Data unavailable",
      reason:`${asset} IV or realized-volatility data is insufficient; no timing conclusion is allowed.`
    },
    timing_inputs_unavailable:{
      label:"Data unavailable",
      reason:`${asset} Fear & Greed history is insufficient; no timing conclusion is allowed.`
    },
    sell_now:{
      label:"Sell Put now",
      reason:`${asset} VRP is ${vrp}; volatility and market fear are rising together.`
    },
    sell_ok:{
      label:"Sell Put window",
      reason:`${asset} conditions are favorable with VRP at ${vrp}; position sizing still matters.`
    },
    wait_better_vrp:{
      label:"Wait for a better entry",
      reason:`Some ${asset} conditions are met, but VRP at ${vrp} is not high enough.`
    },
    wait_entry:{

    },

      label:"Do not open",

function timingValue(value,digits=1,suffix="",signed=false){
  const number=Number(value);
  if(!Number.isFinite(number)) return "—";
  const sign=signed&&number>0?"+":"";
  return `${sign}${number.toFixed(digits)}${suffix}`;
}

function actionEvidenceItem(item){
  const node=document.createElement("div");
  node.className=`act-evidence-item${item.tone?` ${item.tone}`:""}`;
  node.setAttribute("role","listitem");
  const label=document.createElement("span");
  label.textContent=String(item.label||"");
  const value=document.createElement("strong");
  value.textContent=String(item.value||"—");
  node.append(label,value);
  if(item.note){
    const note=document.createElement("small");
    note.textContent=String(item.note);
    node.append(note);
  }
  if(item.impact){
    const impact=document.createElement("small");
    impact.className="act-impact";

    impact.append(impactLabel,document.createTextNode(String(item.impact)));

  return node;

function fillCopy(template,values={}){
  return Object.entries(values).reduce(
    (copy,[key,value])=>copy.replaceAll(`{${key}}`,String(value)),
    String(template||"")
  );
}

function timingNumber(value){
  if(value===null||value===undefined||value==="") return null;
  const number=Number(value);
  return Number.isFinite(number)?number:null;
}

function dvolPosition(percentile){
  const value=timingNumber(percentile);
  if(value===null) return null;
  if(value>=75) return {
    code:"high",label:t("dvolHigh"),summary:t("dvolHighSummary"),tone:"warn",note:t("ivRankHighNote"),impact:t("ivRankHighImpact")
  };
  if(value<=25) return {
    code:"low",label:t("dvolLow"),summary:t("dvolLowSummary"),tone:"bad",note:t("ivRankLowNote"),impact:t("ivRankLowImpact")
  };
  return {
    code:"middle",label:t("dvolMiddle"),summary:t("dvolMiddleSummary"),tone:"",note:t("ivRankMiddleNote"),impact:t("ivRankMiddleImpact")
  };
}

function vrpReading(vrp){
  const value=timingNumber(vrp);
  if(value===null) return null;
  if(value>0) return {
    label:t("vrpPositive"),tone:"good",note:t("vrpPositiveNote"),impact:t("vrpPositiveImpact")
  };
  if(value<0) return {
    label:t("vrpNegative"),tone:"bad",note:t("vrpNegativeNote"),impact:t("vrpNegativeImpact")
  };
  return {label:t("vrpFlat"),tone:"warn",note:t("vrpFlatNote"),impact:t("vrpFlatImpact")};
}

function dvolDirection(change4h,change1d){
  const shortMove=timingNumber(change4h);
  const dayMove=timingNumber(change1d);
  if(shortMove===null||dayMove===null) return null;
  if(shortMove>0&&dayMove>0) return {
    label:t("volRising"),summary:t("volSummaryRising"),tone:"bad",note:t("volRisingNote"),impact:t("volRisingImpact")
  };
  if(shortMove<0&&dayMove<0) return {
    label:t("volCooling"),summary:t("volSummaryCooling"),tone:"good",note:t("volCoolingNote"),impact:t("volCoolingImpact")
  };
  return {
    label:t("volMixed"),summary:t("volSummaryMixed"),tone:"warn",note:t("volMixedNote"),impact:t("volMixedImpact")
  };
}

function sellPutLogic(action){
  const metrics=action?.metrics||{};
  const dvol=timingNumber(metrics.dvol);
  const rv=timingNumber(metrics.rv);
  const vrp=timingNumber(metrics.vrp);
  const percentile=trustedIvPercentile(LAST_IV_HISTORY,"days_365",365);
  const change4h=timingNumber(metrics.dvol_change_4h);
  const change1d=timingNumber(
    metrics.dvol_change_1d??LAST_IV_HISTORY?.change_1d_pct
  );
  const position=dvolPosition(percentile);
  const marketProxyReady=[dvol,rv,vrp].every(value=>value!==null);
  const premium=marketProxyReady?vrpReading(vrp):null;
  const direction=dvolDirection(change4h,change1d);
  const positionReady=dvol!==null&&position;
  const coreComplete=positionReady&&marketProxyReady&&direction;
  const percentileValue=timingValue(percentile,1,"%");
  const vrpValue=timingValue(vrp,1," pp",true);
  const fngValue=timingNumber(metrics.fng);
  const fngMoveValue=timingNumber(metrics.fng_drop_3d);
  const fng=fngValue!==null
    ?String(Math.round(fngValue))
    :null;
  const fngMove=fngMoveValue!==null
    ?timingValue(fngMoveValue,0,"",true)
    :null;
  const stale=action?.action_code==="stale";
  const insufficientHistory=action?.action_code==="insufficient_history";
  const blocked=stale||action?.blocked;
  const blockedReason=stale
    ?t("volDataStale")
    :insufficientHistory
      ?fillCopy(t("volHistoryInsufficient"),{asset:currentAsset})
      :t("volDataUnavailable");
  const status=blocked
    ?{
      action:"no",label:t("qualitativeIncomplete"),reason:blockedReason
    }
    :!coreComplete
      ?{action:"no",label:t("qualitativeIncomplete"),reason:positionReady?t("volDataUnavailable"):t("volPositionUnavailable")}
      :vrp<=0
        ?{action:"no",label:t("premiumNoEdge"),reason:fillCopy(t("premiumNoEdgeReason"),{value:vrpValue})}
        :position.code==="low"
          ?{action:"wait",label:t("premiumLowVol"),reason:fillCopy(t("premiumLowVolReason"),{value:vrpValue,percentile:percentileValue})}
          :direction.tone==="bad"
            ?{action:"wait",label:t("premiumWorsening"),reason:fillCopy(t("premiumWorseningReason"),{value:vrpValue})}
            :direction.tone==="warn"
              ?{action:"wait",label:t("premiumWaiting"),reason:fillCopy(t("premiumWaitingReason"),{value:vrpValue})}
              :position.code==="middle"
                ?{action:"wait",label:t("premiumMiddleCooling"),reason:fillCopy(t("premiumMiddleCoolingReason"),{value:vrpValue,percentile:percentileValue})}
                :{action:"wait",label:t("premiumReview"),reason:fillCopy(t("premiumReviewReason"),{value:vrpValue})};
  const moveValues={
    change4h:timingValue(change4h,2,"%",true),
    change1d:timingValue(change1d,2,"%",true)
  };
  const readings=[];
  if(dvol!==null){
    readings.push({
      label:t("timingDvol"),value:timingValue(dvol,1,"%"),
      note:fillCopy(t("dvolNote"),{value:timingValue(dvol,1,"%")}),
      impact:t("dvolImpact")
    });
  }
  if(position){
    readings.push({
      label:t("timingIvRank"),value:`${percentileValue} · ${position.label}`,
      tone:position.tone,note:fillCopy(position.note,{value:percentileValue}),
      impact:position.impact
    });
  }
  if(direction){
    readings.push({
      label:t("timingDvolMove"),
      value:`4h ${moveValues.change4h} / 1d ${moveValues.change1d} · ${direction.label}`,
      tone:direction.tone,note:direction.note,impact:direction.impact
    });
  }
  if(marketProxyReady){
    readings.push({
      label:t("timingRv"),value:timingValue(rv,1,"%"),
      note:fillCopy(t("rvNote"),{value:timingValue(rv,1,"%")}),
      impact:t("rvImpact")
    });
    readings.push({
      label:t("timingVrp"),value:`${vrpValue} · ${premium.label}`,
      tone:premium.tone,
      note:fillCopy(premium.note,{value:timingValue(Math.abs(vrp),1)}),
      impact:premium.impact
    });
  }
  if(!readings.length){
    readings.push({
      label:t("timingReadingsUnavailable"),value:"—",tone:"bad",
      note:blockedReason
    });
  }
  const unavailableStep=(label,note)=>({
    label,value:t("qualitativeUnavailable"),tone:"bad",note
  });
  let steps;
  if(blocked){
    steps=[t("volPositionStep"),t("premiumStep"),t("entryTimingStep")]
      .map(label=>unavailableStep(label,blockedReason));
  }else{
    const positionMeaning=position
      ?fillCopy(t({
        high:"volPositionHighMeaning",
        middle:"volPositionMiddleMeaning",
        low:"volPositionLowMeaning"
      }[position.code]),{percentile:percentileValue})
      :"";
    const timingMeaning=direction
      ?t(direction.tone==="good"
        ?"entryTimingCoolingMeaning"
        :direction.tone==="bad"
          ?"entryTimingWarmingMeaning"
          :"entryTimingMixedMeaning")
      :"";
    steps=[
      positionReady
        ?{
          label:t("volPositionStep"),value:position.label,tone:position.tone,
          note:fillCopy(t("volPositionEvidence"),{
            dvol:timingValue(dvol,1,"%"),percentile:percentileValue,meaning:positionMeaning
          })
        }
        :unavailableStep(t("volPositionStep"),t("volPositionUnavailable")),
      marketProxyReady
        ?{
          label:t("premiumStep"),
          value:t(vrp>0?"positivePremium":"nonPositivePremium"),
          tone:vrp>0?"good":"bad",
          note:fillCopy(t("premiumEvidence"),{
            dvol:timingValue(dvol,1,"%"),rv:timingValue(rv,1,"%"),vrp:vrpValue
          })
        }
        :unavailableStep(t("premiumStep"),t("premiumProxyMissing")),
      direction
        ?{
          label:t("entryTimingStep"),
          value:t(direction.tone==="good"
            ?"entryTimingImproving"
            :direction.tone==="bad"
              ?"entryTimingWarming"
              :"entryTimingUnconfirmed"),
          tone:direction.tone,
          note:fillCopy(t("entryTimingEvidence"),{
            ...moveValues,meaning:timingMeaning
          })
        }
        :unavailableStep(t("entryTimingStep"),t("premiumHarvestMissingNote"))
    ];
  }
  return {
    action:{
      ...action,
      action:status.action,
      action_code:blocked&&action?.action_code?action.action_code:"volatility_context",
      action_label:status.label,
      action_reason:status.reason
    },
    groups:[
      {
        title:t("timingReadings"),model:t("timingReadingsModel"),
        evidence:readings,kind:"act-readings"
      },
      {
        title:t("sellPutJudgement"),model:t("sellPutJudgementModel"),
        evidence:steps,kind:"act-steps"
      }
    ],
    model:t("sellPutJudgementModel"),
    readings,
    evidence:steps,

function reconcileLiveQuote(
  row,
  side,
  payload,
  spotPrice,
  wideSpreadThreshold=30
){
  if(!row||!payload||payload.stale) return false;
  const priceKey=side==="ask"?"best_ask_price":"best_bid_price";
  const sizeKey=side==="ask"?"ask_size":"bid_size";
  const price=finiteNumber(payload?.[priceKey]);
  const size=finiteNumber(payload?.[sizeKey]);
  if(price===null||price<=0||size===null||size<=0){
    const quoteKey=side==="ask"?"ask_usd":"bid_usd";
    const unavailableBasis=`live_${side}_unavailable`;
    const payloadBid=side==="ask"
      ?finiteNumber(payload.best_bid_price)
      :null;
    const alreadyUnavailable=(
      row.quote_basis===unavailableBasis
      &&row[quoteKey]===null
      &&row[`${side}_size`]===null
      &&row.min_premium_usd===null
      &&(
        side==="bid"
          ?(
            row.ann_yield===null
            &&row.net_yield===null
            &&row.fee_usd===null
            &&!("panic_yield" in row)
            &&!("time_yield" in row)
          )
          :(
            row.min_cost_usd===null
            &&row.max_loss_usd===null
            &&row.breakeven_usd===null
            &&row.breakeven_move_pct===null
            &&row.bid_usd===payloadBid
            &&row.quote_quality==="unavailable"
          )
      )
    );
    row.quote_depth_timestamp=payload.quoted_at||null;
    if(alreadyUnavailable) return false;

    row[quoteKey]=null;
    row[`${side}_size`]=null;
    row.min_premium_usd=null;
    row.quote_basis=unavailableBasis;
    row.quote_depth_verified=false;
    if(side==="bid"){
      row.ann_yield=null;
      row.net_yield=null;
      row.fee_usd=null;
      delete row.panic_yield;
      delete row.time_yield;
      return true;
    }
    row.min_cost_usd=null;
    row.max_loss_usd=null;
    row.breakeven_usd=null;
    row.breakeven_move_pct=null;
    row.bid_usd=payloadBid;
    Object.assign(row,{
      mid_usd:null,
      spread_usd:null,
      spread_pct:null,
      spread_warning:true,
      quote_quality:"unavailable"
    });
    return true;
  }

  row[side==="ask"?"ask_usd":"bid_usd"]=price;
  row[`${side}_size`]=size;
  row.quote_basis=`live_${side}`;
  row.quote_depth_verified=true;
  row.quote_depth_timestamp=payload.quoted_at||null;

  const minimum=finiteNumber(row.min_trade_amount);
  if(minimum!==null&&minimum>0){
    row.min_premium_usd=price*minimum;
  }

  if(side==="bid"){
    const strike=finiteNumber(row.strike);
    const days=finiteNumber(row.days);
    const spot=finiteNumber(spotPrice);
    const capital=isCoveredCall()?spot:strike;
    if(capital!==null&&capital>0&&days!==null&&days>0){
      row.ann_yield=price/capital*365/days*100;
      if(spot!==null&&spot>0){
        const fee=Math.min(.0003*spot,.125*price);
        row.fee_usd=fee;
        row.net_yield=Math.max(0,price-fee)/capital*365/days*100;
      }
    }
    delete row.panic_yield;
    delete row.time_yield;
    return true;
  }

  row.min_cost_usd=row.min_premium_usd;
  row.max_loss_usd=row.min_premium_usd;
  const strike=finiteNumber(row.strike);
  const spot=finiteNumber(spotPrice);
  if(strike!==null&&strike>0){
    row.breakeven_usd=strike+price;
    row.breakeven_move_pct=(
      spot!==null&&spot>0
        ?(row.breakeven_usd/spot-1)*100
        :null
    );
  }

  const bid=finiteNumber(payload?.best_bid_price);
  row.bid_usd=bid;
  if(bid===null){
    Object.assign(row,{
      mid_usd:null,
      spread_usd:null,
      spread_pct:null,
      spread_warning:true,
      quote_quality:"unavailable"
    });
  }else if(bid<=0){
    Object.assign(row,{
      mid_usd:null,
      spread_usd:null,
      spread_pct:null,
      spread_warning:true,
      quote_quality:"no_bid"
    });
  }else if(bid>price){
    Object.assign(row,{
      mid_usd:null,
      spread_usd:null,
      spread_pct:null,
      spread_warning:true,
      quote_quality:"crossed"
    });
  }else{
    const midpoint=(bid+price)/2;
    const spread=price-bid;
    const spreadPct=spread/midpoint*100;
    const warning=spreadPct>=Number(wideSpreadThreshold||30);
    Object.assign(row,{
      mid_usd:midpoint,
      spread_usd:spread,
      spread_pct:spreadPct,
      spread_warning:warning,
      quote_quality:warning?"wide":"normal"
    });
  }
  return true;
}

function optionRowReference(instrument){
  const expiries=DATA?.expiries||DATA?.exchanges?.Deribit?.expiries||{};
  const rowKey=isCallMode()?"calls":"puts";
  for(const group of Object.values(expiries)){
    const row=(group?.[rowKey]||[]).find(
      candidate=>candidate.instrument===instrument
    );
    if(row) return row;
  }
  return null;
}

function scheduleLiveQuoteRender(){
  if(liveQuoteRenderTimer!==null) return;
  const generation=quoteDepthState?.generation;
  liveQuoteRenderTimer=setTimeout(()=>{
    liveQuoteRenderTimer=null;
    if(generation!==quoteDepthState?.generation||!DATA) return;
    const focusedButton=document.activeElement?.closest?.("[data-quote-depth]");
    const focusTarget=focusedButton?{
      key:focusedButton.dataset.depthKey,
      side:focusedButton.dataset.depthSide,
      container:focusedButton.closest("#snapshot")?"snapshot":"content"
    }:null;
    renderSnapshot();
    render();
    if(focusTarget){
      const replacement=[...$(focusTarget.container).querySelectorAll(
        "[data-quote-depth]"
      )].find(node=>(
        node.dataset.depthKey===focusTarget.key
        &&node.dataset.depthSide===focusTarget.side
      ));
      replacement?.focus({preventScroll:true});
    }
  },0);
}

function applyLiveQuotePayload(instrument,side,payload){
  const row=optionRowReference(instrument);
  const updated=reconcileLiveQuote(
    row,
    side,
    payload,
    DATA?.spot_price,
    DATA?.wide_spread_threshold_pct
  );
  if(updated) scheduleLiveQuoteRender();
  return updated;
}

function updateQuoteDepthNode(node,payload){
  node.setAttribute("aria-busy","false");
  node.setAttribute("aria-disabled","false");
  node.classList.remove("idle","loading");
  node.title=payload?.quoted_at
    ?`${t("depthRefreshTip")} · ${payload.quoted_at}`
    :t("depthRefreshTip");
  if(!payload){
    node.textContent=t("depthRetry");
    node.classList.add("stale");
    node.title=t("depthRetryTip");
    return;
  }
  const side=node.dataset.depthSide;
  const size=finiteNumber(payload?.[`${side}_size`]);
  const livePrice=finiteNumber(
    payload?.[side==="ask"?"best_ask_price":"best_bid_price"]
  );
  const displayedPrice=finiteNumber(node.dataset.depthPrice);
  const stale=Boolean(payload&&payload.stale);
  const liveUnavailable=Boolean(payload&&!stale)&&(
    livePrice===null||livePrice<=0||size===null||size<=0
  );
  if(liveUnavailable){
    const instrument=decodeURIComponent(node.dataset.depthInstrument||"");
    if(applyLiveQuotePayload(instrument,side,payload)){
      node.dataset.depthPrice="";
    }
    node.textContent=t("depthUnavailable");
    node.classList.add("stale");
    return;
  }
  const tolerance=displayedPrice===null
    ?0
    :Math.max(.00005,Math.abs(displayedPrice)*1e-8);
  const priceChanged=size!==null&&size>0&&(
    livePrice===null
    ||displayedPrice===null
    ||Math.abs(livePrice-displayedPrice)>tolerance
  );
  if(priceChanged){
    const instrument=decodeURIComponent(node.dataset.depthInstrument||"");
    if(
      livePrice!==null
      &&applyLiveQuotePayload(instrument,side,payload)
    ){
      node.dataset.depthPrice=String(livePrice);
      node.textContent=formatDepthValue(depthValueUsd(livePrice,size));
      node.classList.toggle("stale",false);
      return;
    }
    node.textContent=t("depthPriceChanged");
    node.classList.add("stale");
    return;
  }
  const value=depthValueUsd(livePrice,size);
  node.textContent=formatDepthValue(value);
  node.classList.toggle("stale",stale);
  if(stale) node.textContent+=` · ${t("depthStale")}`;
}

function pumpQuoteDepthQueue(state){
  while(
    state===quoteDepthState
    &&state.active<MAX_QUOTE_DEPTH_CONCURRENCY
    &&state.queue.length
  ){
    const task=state.queue.shift();
    const {key,instrument}=task;
    state.queued.delete(key);
    if(state.cache.has(key)||state.pending.has(key)) continue;
    state.active++;
    const request=fetch(quoteDepthUrl(instrument),{
      signal:state.controller.signal,
      cache:"no-store"
    }).then(async response=>{
      if(!response.ok){
        const error=new Error(`HTTP ${response.status}`);
        error.status=response.status;
        throw error;
      }
      return response.json();
    });
    state.pending.set(key,request);
    request.then(payload=>{
      if(state!==quoteDepthState) return;
      state.cache.set(key,payload);
      updateQuoteDepthNodes(state,key,payload);
    }).catch(error=>{
      if(error.name==="AbortError"||state!==quoteDepthState) return;
      state.cache.set(key,null);
      updateQuoteDepthNodes(state,key,null);
    }).finally(()=>{
      state.pending.delete(key);
      state.active=Math.max(0,state.active-1);
      pumpQuoteDepthQueue(state);
    });
  }
}

function enqueueQuoteDepth(node){
  const state=quoteDepthState;
  if(!state||isStockMode()) return;
  const key=node.dataset.depthKey;
  const instrument=decodeURIComponent(node.dataset.depthInstrument||"");
  if(!key||!instrument) return;
  if(state.cache.has(key)){
    updateQuoteDepthNode(node,state.cache.get(key));
    return;
  }
  if(state.pending.has(key)||state.queued.has(key)) return;
  state.queued.add(key);
  state.queue.push({key,instrument});
  pumpQuoteDepthQueue(state);
}

function activateQuoteDepthLoading(){
  const state=quoteDepthState;
  if(!state||isStockMode()) return;
  document.querySelectorAll("[data-quote-depth]").forEach(node=>{
    const key=node.dataset.depthKey;
    if(state.pending.has(key)||state.queued.has(key)){
      setQuoteDepthNodeLoading(node);
    }else if(state.cache.has(key)){
      updateQuoteDepthNode(node,state.cache.get(key));
    }
  });
}
