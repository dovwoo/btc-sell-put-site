async function loadData(){
  const market=currentMarket;
  const symbol=currentSymbol();
  const key=selectionKey();
  const version=++requestVersion;
  resetQuoteDepthLoading();
  if(requestController) requestController.abort();
  requestController=new AbortController();
  const controller=requestController;
  const {signal}=controller;
  $("content").className="state";
  $("content").textContent=loadingCopy();
  try{
    const optionsUrl=isCoveredCall()
      ?(market==="us_stock"
        ?`/api/us-stocks/covered-call?ticker=${encodeURIComponent(symbol)}`
        :apiUrl("/api/covered-call",symbol))
      :isBuyCall()
      ?(market==="us_stock"
        ?`/api/us-stocks/buy-call?ticker=${encodeURIComponent(symbol)}`
        :apiUrl("/api/buy-call",symbol))
      :(market==="us_stock"
        ?`/api/us-stocks/options?ticker=${encodeURIComponent(symbol)}`
        :apiUrl("/api/options",symbol));
    const needsSellerTiming=market==="crypto"&&!isCallMode();
    const timingPromise=needsSellerTiming
      ?optionalJson(apiUrl("/api/timing",symbol),signal)
      :Promise.resolve(null);
    const historyPromise=market==="crypto"
      ?optionalJson(apiUrl("/api/timing-history",symbol),signal)
      :Promise.resolve(null);
    const optionResponse=await marketFetch(optionsUrl,{
      signal,
      cache:"no-store",
      headers:market==="us_stock"?{"X-Mango-Owner-Request":"1"}:undefined
    });
    if(version!==requestVersion||key!==selectionKey()) return;
    if(!optionResponse.ok){
      let detail="";
      try{detail=(await optionResponse.json()).error||""}catch(_){}
      const error=new Error(detail||`HTTP ${optionResponse.status}`);
      error.status=optionResponse.status;
      throw error;
    }
    DATA=await optionResponse.json();
    if(
      version!==requestVersion
      ||key!==selectionKey()
      ||(DATA.symbol||DATA.asset)!==symbol
    ) return;
    DATA_RECEIVED_AT=Date.now();
    if(market==="us_stock") document.documentElement.classList.add("stock-data-ready");
    LAST_TIMING=null;
    LAST_HISTORY=null;
    LAST_IV_HISTORY=null;
    $("spotPrice").textContent=formatPrice(DATA.spot_price,DATA.price_decimals);
    $("spotLabel").textContent=market==="us_stock"?`${symbol} ${t("stockSpot")}`:`${symbol} Spot`;
    $("ts").textContent=market==="us_stock"
      ?(DATA.updated?t("retrievedAt").replace("{time}",DATA.updated):"")
      :DATA.provider_timestamp||DATA.quoted_at||DATA.updated||"";
    renderBuyCallRisk();
    renderMarketMeta();
    renderAction(null);
    renderSnapshot();
    render();
    resetIvContext();
    emitMarketData("chain");
    void loadIvRange();
    const [timing,history]=await Promise.all([
      timingPromise,
      historyPromise
    ]).catch(error=>{
      if(error.name==="AbortError")throw error;
      return [null,null];
    });
    if(
      version!==requestVersion
      ||key!==selectionKey()
      ||signal.aborted
      ||(DATA?.symbol||DATA?.asset)!==symbol
    ) return;
    LAST_TIMING=timing||timingUnavailableAction();
    LAST_HISTORY=history;
    renderAction(LAST_TIMING);
    if(LAST_IV_HISTORY)renderHistory(history,LAST_IV_HISTORY);
    emitMarketData("context");
  }catch(error){
    if(error.name==="AbortError"||version!==requestVersion||key!==selectionKey()) return;
    controller.abort();
    DATA=null;
    DATA_RECEIVED_AT=0;
    LAST_TIMING=null;
    LAST_HISTORY=null;
    LAST_IV_HISTORY=null;
    window._snapStrike=null;
    $("spotPrice").textContent="—";
    $("spotLabel").textContent=market==="us_stock"?`${symbol} ${t("stockSpot")}`:`${symbol} Spot`;
    $("marketMeta").textContent="";
    $("marketMeta").className="market-meta";
    $("ts").textContent="—";
    if(market==="us_stock"){
      $("stockSearchError").textContent=error.status===404
        ?t("stockNotFound").replace("{symbol}",symbol)
        :"";
    }
    $("snapshot").innerHTML="";
    $("content").className="state error";
    $("content").textContent=`${t("fetchError")}: ${error.message}`;
    clearCharts();
    renderAction({
      action:"wait",
      action_label:t("dataUnavailable"),
      action_reason:t("dataUnavailableReason")
    });
    emitMarketData("error",error.message);
  }
}

function optionRows(){
  if(!DATA) return [];
  const rows=[];
  const expiries=DATA.expiries||DATA.exchanges?.Deribit?.expiries||{};
  Object.entries(expiries).forEach(([expiry,group])=>{
    const sideRows=isCallMode()?group.calls:group.puts;
    (sideRows||[]).forEach(row=>rows.push({...row,expiry:row.expiry||expiry}));
  });
  return rows;
}

function deltaColor(delta){
  if(delta===null||delta===undefined) return "#787b86";
  const absolute=Math.abs(delta);
  if(absolute>=.5) return "#ef5350";
  if(absolute>=.3) return "#ffd600";
  if(absolute>=.15) return "#26a69a";
  return "#7da0ff";
}

function formatDelta(delta){
  if(delta===null||delta===undefined) return "—";
  return `<span style="color:${deltaColor(delta)};font-weight:600">${Number(delta).toFixed(2)}</span>`;
}

function formatGreekNumber(value,kind){
  if(value===null||value===undefined||value==="") return "—";
  const number=Number(value);
  if(!Number.isFinite(number)) return "—";
  const absolute=Math.abs(number);
  if(kind==="gamma") return number.toFixed(8).replace(/\.?0+$/,"");
  const digits=absolute>=100?1:absolute>=1?2:absolute>=.01?3:4;
  return String(Number(number.toFixed(digits)));
}

function formatGreek(value,kind){
  if(kind==="delta") return formatDelta(value);
  const formatted=formatGreekNumber(value,kind);
  if(formatted==="—") return formatted;
  const color=kind==="theta"&&Number(value)<0?"#f0b90b":"#b2b5be";
  return `<span style="color:${color};font-weight:600">${formatted}</span>`;
}

function greeksCells(row){
  return ["delta","gamma","theta","vega"]
    .map(kind=>`<td>${formatGreek(row[kind],kind)}</td>`)
    .join("");
}

function ivColor(iv){
  if(iv===null||iv===undefined) return "#787b86";
  if(iv>=100) return "#ef5350";
  if(iv>=70) return "#ffd600";
  if(iv>=40) return "#26a69a";
  return "#7da0ff";
}

function formatIv(iv){
  if(iv===null||iv===undefined) return "—";
  return `<span style="color:${ivColor(iv)};font-weight:600">${Number(iv).toFixed(1)}%</span>`;
}

function yieldColor(value){
  if(value>=50) return "#ff6d00";
  if(value>=20) return "#ffd600";
  if(value>=10) return "#26a69a";
  return "#787b86";
}

function formatYield(row){
  const annualYield=finiteNumber(row.ann_yield);
  if(annualYield===null) return "—";
  return `<span style="color:${yieldColor(annualYield)};font-weight:650">${annualYield.toFixed(1)}%</span>`;
}

function depthValueUsd(price,size,multiplier=1){
  const normalizedPrice=finiteNumber(price);
  const normalizedSize=finiteNumber(size);
  const normalizedMultiplier=finiteNumber(multiplier);
  if(
    normalizedPrice===null||normalizedPrice<=0
    ||normalizedSize===null||normalizedSize<=0
    ||normalizedMultiplier===null||normalizedMultiplier<=0
  ) return null;
  return normalizedPrice*normalizedSize*normalizedMultiplier;
}

function formatTopDepth(row,side){
  const sizeKey=side==="ask"?"ask_size":"bid_size";
  const priceKey=side==="ask"?"ask_usd":"bid_usd";
  if(isStockMode()){
    const size=finiteNumber(row?.[sizeKey]);
    const price=finiteNumber(row?.[priceKey]);
    const multiplier=row?.contract_multiplier
      ??DATA?.contract_multiplier
      ??100;
    const value=depthValueUsd(price,size,multiplier);
    return `<span class="quote-depth">${formatDepthValue(value)}</span>`;
  }
  const instrument=String(row?.instrument||"");
  if(!instrument){
    return `<span class="quote-depth">—</span>`;
  }
  const key=encodeURIComponent(quoteDepthKey(instrument));
  const encodedInstrument=encodeURIComponent(instrument);
  const displayedPrice=finiteNumber(
    row?.[priceKey]
  );
  return `<button type="button" class="quote-depth idle" data-quote-depth data-depth-key="${key}" data-depth-side="${side}" data-depth-instrument="${encodedInstrument}" data-depth-price="${displayedPrice??""}" aria-busy="false" aria-disabled="false" title="${t("depthViewTip")}">${t("depthView")}</button>`;
}

function formatDepthValue(value){
  const number=finiteNumber(value);
  if(number===null||number<=0) return "—";
  return formatPrice(number,number>=100?0:2);
}

function depthHeader(side){
  const label=side==="ask"?t("topAskDepth"):t("topBidDepth");
  return tip(label,t("depthValueTip"));
}

function formatBid(row){
  const decimals=DATA?.price_decimals===0?2:Math.min(4,(DATA?.price_decimals||2)+1);
  let html=formatPrice(row.bid_usd,decimals);
  if(isStockMode()){
    html+=`<span class="cell-note">${t("contractPremium")} ${formatPrice(row.min_premium_usd,2)} · ${t("obligation")} ${formatPrice(row.min_obligation_usd,2)}</span>`;
    return html;
  }
  if(Number(row.contract_multiplier)>1){
    html+=`<span class="cell-note">min ${formatPrice(row.min_premium_usd,2)} / ${formatAmount(row.min_trade_amount,4)} ${currentSymbol()} · ${t("obligation")} ${formatPrice(row.min_obligation_usd,2)}</span>`;
  }
  return html;
}

function coveredYieldHeader(){
  const copy=_lang==="en"
    ?"Call bid divided by the current underlying price, annualized. It measures premium income only and excludes the underlying return, assignment, fees, and slippage."
    :"Call 顶档 Bid ÷ 当前标的价格后年化；只衡量权利金收入，不包含现货涨跌、行权、手续费和滑点。";
  return tip(t("coveredYield"),copy);
}

function formatCoveredBid(row){
  const decimals=DATA?.price_decimals===0?2:Math.min(4,(DATA?.price_decimals||2)+1);
  const premium=finiteNumber(row.min_premium_usd);
  const cover=isStockMode()
    ?`${formatAmount(row.contract_multiplier??100,0)} 股`
    :`${formatAmount(row.min_trade_amount??DATA?.min_trade_amount,4)} ${currentSymbol()}`;
  return `${formatPrice(row.bid_usd,decimals)}<span class="cell-note">${t("contractPremium")} ${formatPrice(premium,2)} · ${t("coverRequirement")} ${cover}</span>`;
}

function finiteNumber(value){
  if(value===null||value===undefined||value==="") return null;
  const number=Number(value);
  return Number.isFinite(number)?number:null;
}

function getStrikeBounds(){
  const min=finiteNumber($("fMinStrike").value);
  const max=finiteNumber($("fMaxStrike").value);
  return {
    min,
    max,
    valid:(min===null||min>=0)
      &&(max===null||max>=0)
      &&(min===null||max===null||min<=max)
  };
}

function getDeltaBounds(){
  const min=finiteNumber($("fMinDelta").value);
  const max=finiteNumber($("fMaxDelta").value);
  return {
    min,
    max,
    valid:(min===null||(min>=-1&&min<=1))
      &&(max===null||(max>=-1&&max<=1))
      &&(min===null||max===null||min<=max)
  };
}

function getOptionFilterBounds(){
  return {strike:getStrikeBounds(),delta:getDeltaBounds()};
}

function filterValidationError(bounds){
  if(!bounds.strike.valid) return t("invalidStrikeRange");
  if(!bounds.delta.valid) return t("invalidDeltaRange");
  return "";
}

function filterRowsByDelta(rows,bounds=getDeltaBounds()){
  if(!bounds.valid) return [];
  if(bounds.min===null&&bounds.max===null) return rows;
  return rows.filter(row=>{
    const delta=finiteNumber(row.delta);
    return delta!==null
      &&(bounds.min===null||delta>=bounds.min)
      &&(bounds.max===null||delta<=bounds.max);
  });
}

function filterCallRowsByStrike(rows,bounds=getStrikeBounds()){
  if(!bounds.valid) return [];
  return rows.filter(row=>{
    const strike=Number(row.strike);
    return Number.isFinite(strike)
      &&(bounds.min===null||strike>=bounds.min)
      &&(bounds.max===null||strike<=bounds.max);
  });
}

function callCost(row){
  return finiteNumber(row.min_cost_usd??row.min_premium_usd);
}

function callBreakeven(row){
  const provided=finiteNumber(row.breakeven_usd);
  if(provided!==null) return provided;
  const strike=finiteNumber(row.strike);
  const ask=finiteNumber(row.ask_usd);
  return strike!==null&&ask!==null?strike+ask:null;
}

function callBreakevenMove(row){
  const provided=finiteNumber(row.breakeven_move_pct);
  if(provided!==null) return provided;
  const breakeven=callBreakeven(row);
  const spot=finiteNumber(DATA?.spot_price);
  return breakeven!==null&&spot>0?(breakeven/spot-1)*100:null;
}

function callQuoteDecimals(){
  return DATA?.price_decimals===0
    ?2
    :Math.min(4,(DATA?.price_decimals||2)+1);
}

function callQuoteAlert(row){
  const quality=String(row.quote_quality||"unavailable");
  const spreadPct=finiteNumber(row.spread_pct);
  if(quality==="wide"){
    return {
      tone:"warning",
      label:`Spread ${spreadPct===null?"—":spreadPct.toFixed(1)+"%"}`
    };
  }
  if(quality==="no_bid"){
    return {tone:"danger",label:t("noBidWarning")};
  }
  if(quality==="crossed"){
    return {tone:"danger",label:t("crossedWarning")};
  }
  if(quality==="unavailable"){
    return {tone:"danger",label:t("quoteUnavailableWarning")};
  }
  return {tone:"",label:t("quoteDetails")};
}

function callQuoteDetailToggle(row,detailId){
  const alert=callQuoteAlert(row);
  const warningCopy=alert.tone
    ?`<span aria-hidden="true">⚠</span><span>${alert.label} · ${t("viewQuote")}</span>`
    :`<span>${alert.label}</span>`;
  return `<button type="button" class="quote-detail-toggle${alert.tone?" "+alert.tone:""}" data-call-detail-toggle aria-expanded="false" aria-controls="${detailId}" aria-label="${t("expandQuoteDetails")}">${warningCopy}<span class="quote-detail-chevron" aria-hidden="true">▸</span></button>`;
}

function callReferencePrice(row){
  const mark=finiteNumber(row.mark_usd);
  if(mark!==null) return {label:t("markPrice"),value:mark};
  const theo=finiteNumber(row.theo_usd);
  if(theo!==null) return {label:t("theoPrice"),value:theo};
  return {
    label:isStockMode()?t("theoPrice"):t("markPrice"),
    value:null
  };
}

function formatCallQuoteValue(value){
  const number=finiteNumber(value);
  return number===null?"—":formatPrice(number,callQuoteDecimals());
}

function callQuoteDetailRow(row,detailId){
  const reference=callReferencePrice(row);
  const spread=finiteNumber(row.spread_usd);
  const spreadPct=finiteNumber(row.spread_pct);
  const spreadCopy=spread===null||spreadPct===null
    ?"—"
    :`${formatCallQuoteValue(spread)} · ${spreadPct.toFixed(1)}%`;
  const tone=callQuoteAlert(row).tone;
  const threshold=finiteNumber(DATA?.wide_spread_threshold_pct)??30;
  const note=t("quoteDetailNote").replace(
    "{threshold}",
    formatAmount(threshold,0)
  );
  return `<tr class="quote-detail-row" id="${detailId}" hidden><td colspan="7"><div class="quote-detail-inner"><div class="quote-detail-grid"><div class="quote-detail-item"><span>${t("bidPrice")}</span><strong>${formatCallQuoteValue(row.bid_usd)}</strong></div><div class="quote-detail-item"><span>${reference.label}</span><strong>${formatCallQuoteValue(reference.value)}</strong></div><div class="quote-detail-item"><span>${t("askPrice")}</span><strong>${formatCallQuoteValue(row.ask_usd)}</strong></div><div class="quote-detail-item"><span>${t("spread")}</span><strong class="${tone}">${spreadCopy}</strong></div></div><div class="quote-detail-note">${note}</div></div></td></tr>`;
}

function formatAsk(row,detailId){
  const decimals=DATA?.price_decimals===0?2:Math.min(4,(DATA?.price_decimals||2)+1);
  const ask=finiteNumber(row.ask_usd);
  let html=formatPrice(ask,decimals);
  if(detailId) html+=callQuoteDetailToggle(row,detailId);
  return html;
}

function formatBreakeven(row){
  const breakeven=callBreakeven(row);
  const move=callBreakevenMove(row);
  let html=formatPrice(breakeven,DATA?.strike_decimals??assetSpec().strikeDecimals);
  if(move!==null){
    const sign=move>0?"+":"";
    html+=`<span class="cell-note">${t("requiredMove")} ${sign}${move.toFixed(1)}%</span>`;
  }
  return html;
}

function breakevenHeader(){
  return tip(t("breakeven"),t("breakevenTip"));
}

function callMoneyness(strike,spot=Number(DATA?.spot_price)){
  const distance=(Number(strike)-spot)/spot*100;
  if(!Number.isFinite(distance)) return "—";
  if(Math.abs(distance)<.05) return "ATM";
  return `${distance>0?"OTM":"ITM"} ${Math.abs(distance).toFixed(1)}%`;
}

function renderBuyCallSnapshot(){
  const snapshot=$("snapshot");
  const bounds=getOptionFilterBounds();
  const validationError=filterValidationError(bounds);
  if(validationError){
    snapshot.innerHTML=`<div class="state error">${validationError}</div>`;
    return;
  }
  const rows=filterRowsByDelta(
    filterCallRowsByStrike(optionRows(),bounds.strike),
    bounds.delta
  );
  const spot=Number(DATA.spot_price);
  const strikes=[...new Set(rows.map(row=>Number(row.strike)))].sort((a,b)=>a-b);
  if(!strikes.length){
    snapshot.innerHTML=`<div class="state">${t("noCalls")}</div>`;
    return;
  }
  if(!window._snapStrike||!strikes.includes(Number(window._snapStrike))){
    window._snapStrike=strikes.reduce((best,value)=>Math.abs(value-spot)<Math.abs(best-spot)?value:best);
  }
  const target=Number(window._snapStrike);
  const selected=rows.filter(row=>Number(row.strike)===target).sort((a,b)=>a.days-b.days);
  const options=strikes.map(strike=>
    `<option value="${strike}"${strike===target?" selected":""}>${formatStrike(strike)} (${callMoneyness(strike,spot)})</option>`
  ).join("");
  let html=`<h2>Strike <select id="snapshotStrike">${options}</select> ${t("callSnapshot")}</h2>`;
  if(!selected.length){
    html+=`<div class="state">${t("noStrike")}</div>`;
  }else{
    html+=`<div class="table-scroll" data-scroll-hint="${t("scrollHint")}"><table><thead><tr><th>${t("expiry")}</th><th>${t("days")}</th><th>${quoteLabel()}</th><th>${depthHeader("ask")}</th><th>${breakevenHeader()}</th>${greeksHeaders()}<th>${ivHeader()}</th></tr></thead><tbody>`;
    selected.forEach((row,index)=>{
      const detailId=`call-detail-snapshot-${index}`;
      html+=`<tr><td>${row.expiry}</td><td>${Math.round(row.days)}d</td><td>${formatAsk(row,detailId)}</td><td>${formatTopDepth(row,"ask")}</td><td>${formatBreakeven(row)}</td>${greeksCells(row)}<td>${formatIv(row.iv)}</td></tr>`;
      html+=callQuoteDetailRow(row,detailId);
    });
    html+="</tbody></table></div>";
  }
  snapshot.innerHTML=html;
  $("snapshotStrike").addEventListener("change",event=>{
    window._snapStrike=Number(event.target.value);
    renderSnapshot();
  });
  activateQuoteDepthLoading();
}

function filterSellPutRowsByStrike(
  rows,
  spot,
  bounds=getStrikeBounds()
){
  const normalizedSpot=Number(spot);
  if(!Number.isFinite(normalizedSpot)||normalizedSpot<=0) return [];
  if(!bounds.valid) return [];
  return rows.filter(row=>{
    const strike=Number(row.strike);
    return Number.isFinite(strike)
      &&strike>0
      &&strike<normalizedSpot
      &&(bounds.min===null||strike>=bounds.min)
      &&(bounds.max===null||strike<=bounds.max);
  });
}

function renderSnapshot(){
  const snapshot=$("snapshot");
  if(!DATA){snapshot.innerHTML="";return}
  if(isBuyCall()){
    renderBuyCallSnapshot();
    return;
  }
  if(isCoveredCall()){
    renderCoveredCallSnapshot();
    return;
  }
  const spot=Number(DATA.spot_price);
  const bounds=getOptionFilterBounds();
  const validationError=filterValidationError(bounds);
  if(validationError){
    snapshot.innerHTML=`<div class="state error">${validationError}</div>`;
    return;
  }
  const rows=filterRowsByDelta(
    filterSellPutRowsByStrike(optionRows(),spot,bounds.strike),
    bounds.delta
  );
  const strikes=[...new Set(rows.map(row=>Number(row.strike)))].sort((a,b)=>b-a);
  if(!strikes.length){
    snapshot.innerHTML=`<div class="state">${t("noOptions")}</div>`;
    return;
  }
  const targetPrice=spot*.8;
  if(!window._snapStrike||!strikes.includes(Number(window._snapStrike))){
    window._snapStrike=strikes.reduce((best,value)=>Math.abs(value-targetPrice)<Math.abs(best-targetPrice)?value:best);
  }
  const target=Number(window._snapStrike);
  const selected=rows.filter(row=>Number(row.strike)===target).sort((a,b)=>a.days-b.days);
  const options=strikes.map(strike=>{
    const otm=(spot-strike)/spot*100;
    return `<option value="${strike}"${strike===target?" selected":""}>${formatStrike(strike)} (OTM ${otm.toFixed(0)}%)</option>`;
  }).join("");
  const baseline=DATA.baseline_iv
    ?`<span class="meta">${t("baseline")}: ${Number(DATA.baseline_iv).toFixed(1)}% · 365d median</span>`
    :"";
  let html=`<h2>Strike <select id="snapshotStrike">${options}</select> ${t("snapshot")} ${baseline}</h2>`;
  if(!selected.length){
    html+=`<div class="state">${t("noStrike")}</div>`;
  }else{
    html+=`<div class="table-scroll" data-scroll-hint="${t("scrollHint")}"><table><thead><tr><th>${t("expiry")}</th><th>${t("days")}</th><th>${bidLabel()}</th><th>${depthHeader("bid")}</th><th>${yieldHeader()}</th>${greeksHeaders()}<th>${ivHeader()}</th>${ownerChainHeader()}</tr></thead><tbody>`;
    selected.forEach(row=>{
      html+=`<tr><td>${row.expiry}</td><td>${Math.round(row.days)}d</td><td>${formatBid(row)}</td><td>${formatTopDepth(row,"bid")}</td><td>${formatYield(row)}</td>${greeksCells(row)}<td>${formatIv(row.iv)}</td>${ownerChainCell(row)}</tr>`;
    });
    html+="</tbody></table></div>";
  }
  snapshot.innerHTML=html;
  $("snapshotStrike").addEventListener("change",event=>{
    window._snapStrike=Number(event.target.value);
    renderSnapshot();
  });
  activateQuoteDepthLoading();
}

function renderBuyCall(){
  const spot=Number(DATA.spot_price);
  const maxPremium=Number($("fYield").value)||0;
  const maxDays=Number($("fDays").value)||0;
  const bounds=getOptionFilterBounds();
  const validationError=filterValidationError(bounds);
  if(validationError){
    $("content").className="state error";
    $("content").textContent=validationError;
    return;
  }
  let rows=filterRowsByDelta(
    filterCallRowsByStrike(optionRows(),bounds.strike),
    bounds.delta
  );
  if(maxPremium>0) rows=rows.filter(row=>{
    const cost=callCost(row);
    return cost!==null&&cost<=maxPremium;
  });
  if(maxDays>0) rows=rows.filter(row=>Number(row.days)<=maxDays);
  rows.sort((a,b)=>(callBreakevenMove(a)??Infinity)-(callBreakevenMove(b)??Infinity));
  if(!rows.length){
    $("content").className="state";
    $("content").textContent=t("noCalls");
    return;
  }
  const totalRows=rows.length;
  const renderLimit=300;
  rows=rows.slice(0,renderLimit);
  const grouped={};
  rows.forEach(row=>(grouped[row.expiry]??=[]).push(row));
  let html=totalRows>renderLimit
    ?`<div class="state">${t("narrowFilters").replace("{count}",String(renderLimit))}</div>`
    :"";
  Object.keys(grouped).sort().forEach((expiry,expiryIndex)=>{
    const expiryRows=grouped[expiry];
    html+=`<section style="margin-bottom:17px"><div style="font-size:.8rem;font-weight:600;margin-bottom:4px">${expiry} <span style="color:#787b86;font-weight:400">(${Math.round(expiryRows[0].days)}d)</span></div>`;
    html+=`<div class="table-scroll" data-scroll-hint="${t("scrollHint")}"><table><thead><tr><th>Strike</th><th>${t("moneyness")}</th><th>${quoteLabel()}</th><th>${depthHeader("ask")}</th><th>${breakevenHeader()}</th>${greeksHeaders()}<th>${ivHeader()}</th></tr></thead><tbody>`;
    expiryRows.forEach((row,rowIndex)=>{
      const detailId=`call-detail-list-${expiryIndex}-${rowIndex}`;
      html+=`<tr><td>${formatStrike(row.strike)}</td><td style="color:#26a69a">${callMoneyness(row.strike,spot)}</td><td>${formatAsk(row,detailId)}</td><td>${formatTopDepth(row,"ask")}</td><td>${formatBreakeven(row)}</td>${greeksCells(row)}<td>${formatIv(row.iv)}</td></tr>`;
      html+=callQuoteDetailRow(row,detailId);
    });
    html+="</tbody></table></div></section>";
  });
  $("content").className="";
  $("content").innerHTML=html;
  activateQuoteDepthLoading();
}

function renderCoveredCall(){
  const spot=Number(DATA.spot_price);
  const minYield=Number($("fYield").value)||0;
  const maxDays=Number($("fDays").value)||0;
  const bounds=getOptionFilterBounds();
  const validationError=filterValidationError(bounds);
  if(validationError){
    $("content").className="state error";
    $("content").textContent=validationError;
    return;
  }
  let rows=filterRowsByDelta(
    filterCallRowsByStrike(optionRows(),bounds.strike),
    bounds.delta
  )
    .filter(row=>Number(row.ann_yield)>=minYield);
  if(maxDays>0) rows=rows.filter(row=>Number(row.days)<=maxDays);
  rows.sort((a,b)=>b.ann_yield-a.ann_yield);
  if(!rows.length){
    $("content").className="state";
    $("content").textContent=t("noCalls");
    return;
  }
  const grouped={};
  rows.forEach(row=>(grouped[row.expiry]??=[]).push(row));
  let html="";
  Object.keys(grouped).sort().forEach((expiry,expiryIndex)=>{
    const expiryRows=grouped[expiry];
    html+=`<section style="margin-bottom:17px"><div style="font-size:.8rem;font-weight:600;margin-bottom:4px">${expiry} <span style="color:#787b86;font-weight:400">(${Math.round(expiryRows[0].days)}d)</span></div>`;
    html+=`<div class="table-scroll" data-scroll-hint="${t("scrollHint")}"><table><thead><tr><th>Strike</th><th>${t("moneyness")}</th><th>${bidLabel()}</th><th>${depthHeader("bid")}</th><th>${coveredYieldHeader()}</th>${greeksHeaders()}<th>${ivHeader()}</th></tr></thead><tbody>`;
    expiryRows.forEach((row,rowIndex)=>{
      const detailId=`covered-detail-list-${expiryIndex}-${rowIndex}`;
      html+=`<tr><td>${formatStrike(row.strike)}</td><td style="color:#26a69a">${callMoneyness(row.strike,spot)}</td><td>${formatCoveredBid(row)}${callQuoteDetailToggle(row,detailId)}</td><td>${formatTopDepth(row,"bid")}</td><td>${formatYield(row)}</td>${greeksCells(row)}<td>${formatIv(row.iv)}</td></tr>`;
      html+=callQuoteDetailRow(row,detailId);
    });
    html+="</tbody></table></div></section>";
  });
  $("content").className="";
  $("content").innerHTML=html;
  activateQuoteDepthLoading();
}

function render(){
  if(!DATA){$("content").textContent=loadingCopy();return}
  if(isBuyCall()){
    renderBuyCall();
    return;
  }
  if(isCoveredCall()){
    renderCoveredCall();
    return;
  }
  const spot=Number(DATA.spot_price);
  const minYield=Number($("fYield").value)||0;
  const maxDays=Number($("fDays").value)||0;
  const bounds=getOptionFilterBounds();
  const validationError=filterValidationError(bounds);
  if(validationError){
    $("content").className="state error";
    $("content").textContent=validationError;
    return;
  }
  let rows=filterRowsByDelta(
    filterSellPutRowsByStrike(optionRows(),spot,bounds.strike),
    bounds.delta
  )
    .filter(row=>Number(row.ann_yield)>=minYield);
  if(maxDays>0) rows=rows.filter(row=>Number(row.days)<=maxDays);
  rows.sort((a,b)=>b.ann_yield-a.ann_yield);
  if(!rows.length){
    $("content").className="state";
    $("content").textContent=t("noOptions");
    return;
  }
  const grouped={};
  rows.forEach(row=>(grouped[row.expiry]??=[]).push(row));
  let html="";
  Object.keys(grouped).sort().forEach(expiry=>{
    const expiryRows=grouped[expiry];
    html+=`<section style="margin-bottom:17px"><div style="font-size:.8rem;font-weight:600;margin-bottom:4px">${expiry} <span style="color:#787b86;font-weight:400">(${Math.round(expiryRows[0].days)}d)</span></div>`;
    html+=`<div class="table-scroll" data-scroll-hint="${t("scrollHint")}"><table><thead><tr><th>Strike</th><th>OTM%</th><th>${bidLabel()}</th><th>${depthHeader("bid")}</th><th>${yieldHeader()}</th>${greeksHeaders()}<th>${ivHeader()}</th>${ownerChainHeader()}</tr></thead><tbody>`;
    expiryRows.forEach(row=>{
      const otm=(spot-Number(row.strike))/spot*100;
      html+=`<tr><td>${formatStrike(row.strike)}</td><td style="color:#26a69a">${otm.toFixed(1)}%</td><td>${formatBid(row)}</td><td>${formatTopDepth(row,"bid")}</td><td>${formatYield(row)}</td>${greeksCells(row)}<td>${formatIv(row.iv)}</td>${ownerChainCell(row)}</tr>`;
    });
    html+="</tbody></table></div></section>";
  });
  $("content").className="";
  $("content").innerHTML=html;
  activateQuoteDepthLoading();
}

function ownerChainHeader(){
  if(isCallMode()||isStockMode())return "";

}

function ownerChainCell(row){
  if(isCallMode()||isStockMode())return "";
  return window.MangoOwner?.chainCell?.(row)||"";
}

function alignPrice(priceData,timestamps){
  if(!priceData?.timestamps?.length) return [];
  return timestamps.map(timestamp=>{
    let closest=0;
    let distance=Infinity;
    for(let index=0;index<priceData.timestamps.length;index++){
      const candidate=Math.abs(Number(priceData.timestamps[index])-Number(timestamp));
      if(candidate<distance){distance=candidate;closest=index}
    }
    return priceData.values[closest];
  });
}

function chartMeta(id){
  const rvDays=30;
  const map={
    iv:{
      label:LAST_IV_HISTORY?.metric==="dvol"
        ?t("dvol")
        :(LAST_IV_HISTORY?.current_dvol_pct==null?t("atmIv"):`${t("atmIv")} · DVOL`),
      tip:LAST_IV_HISTORY?.metric==="dvol"?t("dvolTip"):t("atmIvTip"),
      color:CHART_COLORS.iv,overlay:true
    },
    dvol:{label:t("dvol"),tip:t("dvolTip"),color:CHART_COLORS.dvol,overlay:true},
    fng:{label:t("fng"),tip:t("fngTip"),color:CHART_COLORS.fng,overlay:true},
    vrp:{label:t("vrp").replace("30d",rvDays+"d"),tip:t("vrpTip"),color:CHART_COLORS.vrp,overlay:true},
    price:{label:`${currentSymbol()} ${t("price")}`,tip:t("priceTip"),color:CHART_COLORS.price,overlay:false,isPrice:true},
    rv:{label:`${rvDays}d ${t("rv")}`,tip:t("rvTip"),color:CHART_COLORS.rv,overlay:true}
  };
  return map[id];
}

function makeMarketChart(canvasId,id,series,priceData){
  const meta=chartMeta(id);
  const labels=series.timestamps.map(timestamp=>new Date(Number(timestamp)));
  const datasets=[{
    label:meta.label,data:series.values,borderColor:meta.color,backgroundColor:meta.color+"22",
    borderWidth:1.5,pointRadius:series.values.length<3?2:0,tension:.25,yAxisID:"y",fill:false
  }];
  if(
    id==="iv"&&LAST_IV_HISTORY?.metric!=="dvol"
    &&LAST_IV_HISTORY?.dvol?.timestamps?.length
  ){
    datasets.push({
      label:"DVOL",data:alignPrice(LAST_IV_HISTORY.dvol,series.timestamps),
      borderColor:CHART_COLORS.dvol,backgroundColor:CHART_COLORS.dvol+"22",
      borderWidth:1.2,pointRadius:0,tension:.25,yAxisID:"y",fill:false
    });
  }
  if(meta.overlay&&priceData?.timestamps?.length){
    datasets.push({
      label:`${currentSymbol()} Price`,data:alignPrice(priceData,series.timestamps),
      borderColor:"rgba(255,255,255,.26)",borderWidth:1,borderDash:[4,3],
      pointRadius:0,tension:.25,yAxisID:"y1",fill:false
    });
  }
  const scales={
    x:{type:"time",time:{tooltipFormat:"MMM d"},ticks:{color:"#787b86",font:{size:10},maxTicksLimit:6},grid:{color:"#2a2e3944"}},
    y:{position:"left",ticks:{
      color:meta.color,font:{size:10},
      callback:meta.isPrice?formatAxisPrice:value=>Number(value).toFixed(1)
    },grid:{color:"#2a2e3944"}}
  };
  if(meta.overlay){
    scales.y1={position:"right",ticks:{color:"rgba(255,255,255,.3)",font:{size:10},callback:formatAxisPrice},grid:{drawOnChartArea:false}};
  }
  histCharts[canvasId]=new Chart($(canvasId),{
    type:"line",data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      scales,
      plugins:{legend:{display:false},tooltip:{backgroundColor:"#1e222d",titleColor:"#d1d4dc",bodyColor:"#d1d4dc",borderColor:"#2a2e39",borderWidth:1}}
    }
  });
}

function metricNode(label,value,tone=""){
  const item=document.createElement("div");
  item.className="iv-metric";
  const name=document.createElement("span");
  name.textContent=label;
  const result=document.createElement("strong");
  result.textContent=value;
  if(tone)result.className=tone;
  item.append(name,result);
  return item;
}

function numericMetric(value,suffix="%",signed=false){
  if(value===null||value===undefined||value==="")return "—";
  const number=Number(value);
  if(!Number.isFinite(number))return "—";
  const prefix=signed&&number>0?"+":"";
  return `${prefix}${number.toFixed(1)}${suffix}`;
}

function percentileTone(value){
  if(value===null||value===undefined||value==="")return "";
  const number=Number(value);
  if(!Number.isFinite(number))return "";
  if(number>70)return "high";
  if(number<30)return "low";
  return "";
}

function trustedIvPercentile(ivHistory,key,windowDays){
  const rawValue=ivHistory?.percentiles?.[key];
  if(rawValue===null||rawValue===undefined||rawValue==="")return null;
  const value=Number(rawValue);
  if(!Number.isFinite(value))return null;
  const sampleCount=Number(ivHistory?.percentile_sample_counts?.[key]);
  const coverageDays=Number(ivHistory?.percentile_coverage_days?.[key]);
  const hasConfidenceFields=
    Number.isFinite(sampleCount)&&Number.isFinite(coverageDays);
  if(hasConfidenceFields){
    const minimumSamples=Math.max(20,Math.ceil(windowDays*.60));
    if(sampleCount<minimumSamples||coverageDays<windowDays*.80)return null;
    return value;
  }
  return null;
}

function ivAccumulatingCopy(ivHistory){
  const sampleCount=Number(ivHistory?.sample_count);
  return Number.isFinite(sampleCount)
    ?fillCopy(t("ivAccumulatingCount"),{count:Math.max(0,Math.trunc(sampleCount))})
    :t("ivAccumulating");
}

function renderIvMetrics(ivHistory){
  const percentile30=trustedIvPercentile(ivHistory,"days_30",30);
  const percentile90=trustedIvPercentile(ivHistory,"days_90",90);
  const percentile365=trustedIvPercentile(ivHistory,"days_365",365);
  const entries=[
    [t(ivHistory?.metric==="dvol"?"currentDvol":"currentIv"),numericMetric(ivHistory?.current_iv_pct)],
    [t("change1d"),numericMetric(ivHistory?.change_1d_pct,"%",true)],
    [t("change7d"),numericMetric(ivHistory?.change_7d_pct,"%",true)],
    [t("percentile30"),numericMetric(percentile30),percentileTone(percentile30)],
    [t("percentile90"),numericMetric(percentile90),percentileTone(percentile90)],
    [t("percentile1y"),numericMetric(percentile365),percentileTone(percentile365)]
  ];
  $("ivMetrics").replaceChildren(...entries.map(entry=>metricNode(...entry)));
}

function renderHistory(history,ivHistory=LAST_IV_HISTORY){
  clearCharts();
  $("ivContextTitle").textContent=t("ivHistoryTitle");
  $("ivContextSubtitle").textContent=`${currentSymbol()} · ${t("ivHistorySubtitle")}`;
  renderIvMetrics(ivHistory);
  const state=$("ivContextState");
  if(!ivHistory){
    state.style.display="block";
    state.textContent=t("ivUnavailable");
    $("ivContextNote").textContent=isBuyCall()?t("buyerIvNote"):t("sellerIvNote");
    return;
  }
  const context=[];
  if(ivHistory.current_dvol_pct!==null&&ivHistory.current_dvol_pct!==undefined&&Number.isFinite(Number(ivHistory.current_dvol_pct))){
    context.push(`DVOL ${numericMetric(ivHistory.current_dvol_pct)}`);
  }
  if(ivHistory.current_atm_iv_30d_pct!==null&&ivHistory.current_atm_iv_30d_pct!==undefined&&Number.isFinite(Number(ivHistory.current_atm_iv_30d_pct))){
    context.push(`${t("atmIv")} ${numericMetric(ivHistory.current_atm_iv_30d_pct)}`);
  }
  context.push(isBuyCall()?t("buyerIvNote"):t("sellerIvNote"));
  if(ivHistory.history_status==="accumulating")context.push(ivAccumulatingCopy(ivHistory));
  $("ivContextNote").textContent=context.join("  ·  ");
  const fng=ivHistory.fng||history?.fng;
  const charts=[
    {id:"iv",series:ivHistory.iv},
    {id:"vrp",series:ivHistory.vrp},
    {id:"fng",series:fng}
  ].filter(item=>item.series?.timestamps?.length).slice(0,3);
  if(!charts.length){
    state.style.display="block";
    state.textContent=ivHistory.history_status==="accumulating"
      ?ivAccumulatingCopy(ivHistory)
      :t("ivUnavailable");
    return;
  }
  state.style.display="none";
  const available=charts.map(item=>item.id);
  $("chartGrid").className=`chart-grid count-${available.length}`;
  charts.forEach((item,index)=>{
    const box=$("chartBox"+index);
    const meta=chartMeta(item.id);
    box.querySelector("h3").innerHTML=tip(meta.label,meta.tip);
    box.style.display="block";
    makeMarketChart("marketChart"+index,item.id,item.series,ivHistory.price);
  });
  $("chartGrid").style.display="grid";
}

function handleCallQuoteDetailToggle(event){
  if(!isCallMode()) return;
  const button=event.target.closest("[data-call-detail-toggle]");
  if(!button) return;
  const detailId=button.getAttribute("aria-controls");
  const detailRow=detailId?document.getElementById(detailId):null;
  if(!detailRow) return;
  const expanded=button.getAttribute("aria-expanded")==="true";
  button.setAttribute("aria-expanded",String(!expanded));
  button.setAttribute(
    "aria-label",
    expanded?t("expandQuoteDetails"):t("collapseQuoteDetails")
  );
  detailRow.hidden=expanded;
}

function handleQuoteDepthClick(event){
  const button=event.target.closest?.("[data-quote-depth]");
  if(!button||isStockMode()) return;
  const state=quoteDepthState;
  const key=button.dataset.depthKey;
  if(
    !state||!key
    ||state.pending.has(key)
    ||state.queued.has(key)
  ) return;
  state.cache.delete(key);
  setQuoteDepthNodesLoading(state,key);
  enqueueQuoteDepth(button);
}

document.addEventListener("pointerover",event=>{
  const target=event.target.closest?.(".tip");
  if(
    !target
    ||(event.relatedTarget&&target.contains(event.relatedTarget))
  ) return;
  showHoverTooltip(target);
});
document.addEventListener("pointerout",event=>{
  const target=event.target.closest?.(".tip");
  if(
    !target
    ||(event.relatedTarget&&target.contains(event.relatedTarget))
  ) return;
  releaseHoverTooltip(target);
});
document.addEventListener("focusin",event=>{
  const target=event.target.closest?.(".tip");
  if(target) showHoverTooltip(target);
});
document.addEventListener("focusout",event=>{
  const target=event.target.closest?.(".tip");
  if(target) releaseHoverTooltip(target);
});
window.addEventListener("scroll",()=>{
  if(activeHoverTip) positionHoverTooltip(activeHoverTip);
},true);
window.addEventListener("resize",()=>{
  if(activeHoverTip) positionHoverTooltip(activeHoverTip);
});
const hoverTooltipObserver=new MutationObserver(()=>{
  hideDetachedHoverTooltip();
});
["snapshot","content","chartGrid"].forEach(id=>{
  hoverTooltipObserver.observe($(id),{
    childList:true,
    subtree:true
  });
});

if(isBuyCall()){
  $("fYield").value="0";
  $("fYield").placeholder="0=all";
}
setAssetButtons();
setTimeframeButtons();
applyLang();
setPriceChartState("loading");
let dashboardStarted=false;
let dashboardRefreshTimer=null;
let buyCallRiskTimer=null;

function refreshDashboard(){
  if(!dashboardStarted)return;
  loadData();
  if(!isStockMode())loadPriceChart();
}

function scheduleDashboardTimers(){
  clearInterval(dashboardRefreshTimer);
  clearInterval(buyCallRiskTimer);
  dashboardRefreshTimer=null;
  buyCallRiskTimer=null;
  if(!dashboardStarted||document.hidden)return;
  if(!isBuyCall()){
    dashboardRefreshTimer=setInterval(()=>{
      if(isStockMode())return;
      refreshDashboard();
    },120000);
  }else{
    buyCallRiskTimer=setInterval(renderBuyCallRisk,5000);
  }
}

function startDashboard(){
  if(dashboardStarted)return;
  dashboardStarted=true;
  refreshDashboard();
  scheduleDashboardTimers();
}

document.addEventListener("visibilitychange",()=>{
  if(!dashboardStarted)return;
  if(document.hidden){scheduleDashboardTimers();return}
  refreshDashboard();
  scheduleDashboardTimers();
});

window.MangoDashboard={
  start:startDashboard,

  prepareStockSearch,
  refresh:refreshDashboard,
  rerender:()=>{renderSnapshot();render()},
  apiUrl:(path,asset)=>apiUrl(path,asset),

    data:DATA,timing:LAST_TIMING,history:LAST_HISTORY,ivHistory:LAST_IV_HISTORY,
    asset:currentAsset,market:currentMarket,strategy:STRATEGY_MODE,

};

if(!IS_OWNER_ROUTE)startDashboard();
