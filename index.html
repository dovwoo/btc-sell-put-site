function callMoneyness(strike,spot=Number(DATA?.spot_price)){
  const distance=(Number(strike)-spot)/spot*100;
  if(!Number.isFinite(distance)) return "—";
  if(Math.abs(distance)<.05) return "ATM";
  return `${distance>0?"OTM":"ITM"} ${Math.abs(distance).toFixed(1)}%`;
}

function renderBuyCallSnapshot(){
  const snapshot=$("snapshot");
  const bounds=getBuyCallStrikeBounds();
  if(!bounds.valid){
    snapshot.innerHTML=`<div class="state error">${t("invalidStrikeRange")}</div>`;
    return;
  }
  const rows=filterBuyCallRowsByStrike(optionRows(),bounds);
  const spot=Number(DATA.spot_price);
  const strikes=[...new Set(rows.map(row=>Number(row.strike)))].sort((a,b)=>a-b);
  if(!strikes.length){
    snapshot.innerHTML=`<div class="state">${t("noCalls")}</div>`;
    return;
  }
  if(!window._snapStrike||!strikes.includes(Number(window._snapStrike))){
    window._snapStrike=strikes.reduce((best,value)=>Math.abs(value-spot)<Math.abs(best-spot)?value:best);
  }
  const target=Number(window._snapStrike);
  const selected=rows.filter(row=>Number(row.strike)===target).sort((a,b)=>a.days-b.days);
  const options=strikes.map(strike=>
    `<option value="${strike}"${strike===target?" selected":""}>${formatStrike(strike)} (${callMoneyness(strike,spot)})</option>`
  ).join("");
  let html=`<h2>Strike <select id="snapshotStrike">${options}</select> ${t("callSnapshot")}</h2>`;
  if(!selected.length){
    html+=`<div class="state">${t("noStrike")}</div>`;
  }else{
    html+=`<div class="table-scroll" data-scroll-hint="${t("scrollHint")}"><table><thead><tr><th>${t("expiry")}</th><th>${t("days")}</th><th>${quoteLabel()}</th><th>${depthHeader("ask")}</th><th>${breakevenHeader()}</th><th>${deltaHeader()}</th><th>${ivHeader()}</th></tr></thead><tbody>`;
    selected.forEach((row,index)=>{
      const detailId=`call-detail-snapshot-${index}`;
      html+=`<tr><td>${row.expiry}</td><td>${Math.round(row.days)}d</td><td>${formatAsk(row,detailId)}</td><td>${formatTopDepth(row,"ask")}</td><td>${formatBreakeven(row)}</td><td>${formatDelta(row.delta)}</td><td>${formatIv(row.iv)}</td></tr>`;
      html+=callQuoteDetailRow(row,detailId);
    });
    html+="</tbody></table></div>";
  }
  snapshot.innerHTML=html;
  $("snapshotStrike").addEventListener("change",event=>{
    window._snapStrike=Number(event.target.value);
    renderSnapshot();
  });
  activateQuoteDepthLoading();
}

function renderSnapshot(){
  const snapshot=$("snapshot");
  if(!DATA){snapshot.innerHTML="";return}
  if(isBuyCall()){
    renderBuyCallSnapshot();
    return;
  }
  const rows=optionRows();
  const strikes=[...new Set(rows.map(row=>Number(row.strike)))].sort((a,b)=>b-a);
  if(!strikes.length){
    snapshot.innerHTML=`<div class="state">${t("noOptions")}</div>`;
    return;
  }
  const targetPrice=Number(DATA.spot_price)*.8;
  if(!window._snapStrike||!strikes.includes(Number(window._snapStrike))){
    window._snapStrike=strikes.reduce((best,value)=>Math.abs(value-targetPrice)<Math.abs(best-targetPrice)?value:best);
  }
  const target=Number(window._snapStrike);
  const selected=rows.filter(row=>Number(row.strike)===target).sort((a,b)=>a.days-b.days);
  const options=strikes.map(strike=>{
    const otm=(Number(DATA.spot_price)-strike)/Number(DATA.spot_price)*100;
    return `<option value="${strike}"${strike===target?" selected":""}>${formatStrike(strike)} (OTM ${otm.toFixed(0)}%)</option>`;
  }).join("");
  const baseline=DATA.baseline_iv
    ?`<span class="meta">${t("baseline")}: ${Number(DATA.baseline_iv).toFixed(1)}% · 365d median</span>`
    :"";
  let html=`<h2>Strike <select id="snapshotStrike">${options}</select> ${t("snapshot")} ${baseline}</h2>`;
  if(!selected.length){
    html+=`<div class="state">${t("noStrike")}</div>`;
  }else{
    html+=`<div class="table-scroll" data-scroll-hint="${t("scrollHint")}"><table><thead><tr><th>${t("expiry")}</th><th>${t("days")}</th><th>${bidLabel()}</th><th>${depthHeader("bid")}</th><th>${yieldHeader()}</th><th>${deltaHeader()}</th><th>${ivHeader()}</th>${ownerChainHeader()}</tr></thead><tbody>`;
    selected.forEach(row=>{
      html+=`<tr><td>${row.expiry}</td><td>${Math.round(row.days)}d</td><td>${formatBid(row)}</td><td>${formatTopDepth(row,"bid")}</td><td>${formatYield(row)}</td><td>${formatDelta(row.delta)}</td><td>${formatIv(row.iv)}</td>${ownerChainCell(row)}</tr>`;
    });
    html+="</tbody></table></div>";
  }
  snapshot.innerHTML=html;
  $("snapshotStrike").addEventListener("change",event=>{
    window._snapStrike=Number(event.target.value);
    renderSnapshot();
  });
  activateQuoteDepthLoading();
}

function renderBuyCall(){
  const spot=Number(DATA.spot_price);
  const maxPremium=Number($("fYield").value)||0;
  const maxDays=Number($("fDays").value)||0;
  const sort=$("fSort").value;
  const bounds=getBuyCallStrikeBounds();
  if(!bounds.valid){
    $("content").className="state error";
    $("content").textContent=t("invalidStrikeRange");
    return;
  }
  let rows=filterBuyCallRowsByStrike(optionRows(),bounds);
  if(maxPremium>0) rows=rows.filter(row=>{
    const cost=callCost(row);
    return cost!==null&&cost<=maxPremium;
  });
  if(maxDays>0) rows=rows.filter(row=>Number(row.days)<=maxDays);
  if(sort==="move") rows.sort((a,b)=>(callBreakevenMove(a)??Infinity)-(callBreakevenMove(b)??Infinity));
  else if(sort==="premium") rows.sort((a,b)=>(callCost(a)??Infinity)-(callCost(b)??Infinity));
  else rows.sort((a,b)=>a.days-b.days||(callBreakevenMove(a)??Infinity)-(callBreakevenMove(b)??Infinity));
  if(!rows.length){
    $("content").className="state";
    $("content").textContent=t("noCalls");
    return;
  }
  const totalRows=rows.length;
  const renderLimit=300;
  rows=rows.slice(0,renderLimit);
  const grouped={};
  rows.forEach(row=>(grouped[row.expiry]??=[]).push(row));
  let html=totalRows>renderLimit
    ?`<div class="state">${t("narrowFilters").replace("{count}",String(renderLimit))}</div>`
    :"";
  Object.keys(grouped).sort().forEach((expiry,expiryIndex)=>{
    const expiryRows=grouped[expiry];
    html+=`<section style="margin-bottom:17px"><div style="font-size:.8rem;font-weight:600;margin-bottom:4px">${expiry} <span style="color:#787b86;font-weight:400">(${Math.round(expiryRows[0].days)}d)</span></div>`;
    html+=`<div class="table-scroll" data-scroll-hint="${t("scrollHint")}"><table><thead><tr><th>Strike</th><th>${t("moneyness")}</th><th>${quoteLabel()}</th><th>${depthHeader("ask")}</th><th>${breakevenHeader()}</th><th>${deltaHeader()}</th><th>${ivHeader()}</th></tr></thead><tbody>`;
    expiryRows.forEach((row,rowIndex)=>{
      const detailId=`call-detail-list-${expiryIndex}-${rowIndex}`;
      html+=`<tr><td>${formatStrike(row.strike)}</td><td style="color:#26a69a">${callMoneyness(row.strike,spot)}</td><td>${formatAsk(row,detailId)}</td><td>${formatTopDepth(row,"ask")}</td><td>${formatBreakeven(row)}</td><td>${formatDelta(row.delta)}</td><td>${formatIv(row.iv)}</td></tr>`;
      html+=callQuoteDetailRow(row,detailId);
    });
    html+="</tbody></table></div></section>";
  });
  $("content").className="";
  $("content").innerHTML=html;
  activateQuoteDepthLoading();
}

function render(){
  if(!DATA){$("content").textContent=loadingCopy();return}
  if(isBuyCall()){
    renderBuyCall();
    return;
  }
  const spot=Number(DATA.spot_price);
  const minYield=Number($("fYield").value)||0;
  const maxDays=Number($("fDays").value)||0;
  const strikeFilter=$("fStrike").value;
  const sort=$("fSort").value;
  let rows=optionRows().filter(row=>Number(row.ann_yield)>=minYield);
  if(maxDays>0) rows=rows.filter(row=>Number(row.days)<=maxDays);
  if(strikeFilter==="near") rows=rows.filter(row=>Math.abs(Number(row.strike)-spot)/spot<=.2);
  if(sort==="yield") rows.sort((a,b)=>b.ann_yield-a.ann_yield);
  else if(sort==="strike") rows.sort((a,b)=>b.strike-a.strike);
  else rows.sort((a,b)=>a.days-b.days||b.ann_yield-a.ann_yield);
  if(!rows.length){
    $("content").className="state";
    $("content").textContent=t("noOptions");
    return;
  }
  const grouped={};
  rows.forEach(row=>(grouped[row.expiry]??=[]).push(row));
  let html="";
  Object.keys(grouped).sort().forEach(expiry=>{
    const expiryRows=grouped[expiry];
    html+=`<section style="margin-bottom:17px"><div style="font-size:.8rem;font-weight:600;margin-bottom:4px">${expiry} <span style="color:#787b86;font-weight:400">(${Math.round(expiryRows[0].days)}d)</span></div>`;
    html+=`<div class="table-scroll" data-scroll-hint="${t("scrollHint")}"><table><thead><tr><th>Strike</th><th>OTM%</th><th>${bidLabel()}</th><th>${depthHeader("bid")}</th><th>${yieldHeader()}</th><th>${deltaHeader()}</th><th>${ivHeader()}</th>${ownerChainHeader()}</tr></thead><tbody>`;
    expiryRows.forEach(row=>{
      const otm=(spot-Number(row.strike))/spot*100;
      html+=`<tr><td>${formatStrike(row.strike)}</td><td style="color:#26a69a">${otm.toFixed(1)}%</td><td>${formatBid(row)}</td><td>${formatTopDepth(row,"bid")}</td><td>${formatYield(row)}</td><td>${formatDelta(row.delta)}</td><td>${formatIv(row.iv)}</td>${ownerChainCell(row)}</tr>`;
    });
    html+="</tbody></table></div></section>";
  });
  $("content").className="";
  $("content").innerHTML=html;
  activateQuoteDepthLoading();
}

function ownerChainHeader(){
  if(isBuyCall()||isStockMode())return "";
  return window.MangoOwner?.chainHeader?.()||"";
}

function ownerChainCell(row){
  if(isBuyCall()||isStockMode())return "";
  return window.MangoOwner?.chainCell?.(row)||"";
}

function alignPrice(priceData,timestamps){
  if(!priceData?.timestamps?.length) return [];
  return timestamps.map(timestamp=>{
    let closest=0;
    let distance=Infinity;
    for(let index=0;index<priceData.timestamps.length;index++){
      const candidate=Math.abs(Number(priceData.timestamps[index])-Number(timestamp));
      if(candidate<distance){distance=candidate;closest=index}
    }
    return priceData.values[closest];
  });
}

function chartMeta(id){
  const rvDays=assetSpec().rvDays;
  const map={
    dvol:{label:t("dvol"),tip:t("dvolTip"),color:CHART_COLORS.dvol,overlay:true},
    fng:{label:t("fng"),tip:t("fngTip"),color:CHART_COLORS.fng,overlay:true},
    vrp:{label:t("vrp").replace("30d",rvDays+"d"),tip:t("vrpTip"),color:CHART_COLORS.vrp,overlay:true},
    price:{label:`${currentAsset} ${t("price")}`,tip:t("priceTip"),color:CHART_COLORS.price,overlay:false,isPrice:true},
    rv:{label:`${rvDays}d ${t("rv")}`,tip:t("rvTip"),color:CHART_COLORS.rv,overlay:true}
  };
  return map[id];
}

function makeMarketChart(canvasId,id,series,priceData){
  const meta=chartMeta(id);
  const labels=series.timestamps.map(timestamp=>new Date(Number(timestamp)));
  const datasets=[{
    label:meta.label,data:series.values,borderColor:meta.color,backgroundColor:meta.color+"22",
    borderWidth:1.5,pointRadius:0,tension:.25,yAxisID:"y",fill:false
  }];
  if(meta.overlay&&priceData?.timestamps?.length){
    datasets.push({
      label:`${currentAsset} Price`,data:alignPrice(priceData,series.timestamps),
      borderColor:"rgba(255,255,255,.26)",borderWidth:1,borderDash:[4,3],
      pointRadius:0,tension:.25,yAxisID:"y1",fill:false
    });
  }
  const scales={
    x:{type:"time",time:{tooltipFormat:"MMM d"},ticks:{color:"#787b86",font:{size:10},maxTicksLimit:6},grid:{color:"#2a2e3944"}},
    y:{position:"left",ticks:{color:meta.color,font:{size:10},callback:meta.isPrice?formatAxisPrice:undefined},grid:{color:"#2a2e3944"}}
  };
  if(meta.overlay){
    scales.y1={position:"right",ticks:{color:"rgba(255,255,255,.3)",font:{size:10},callback:formatAxisPrice},grid:{drawOnChartArea:false}};
  }
  histCharts[canvasId]=new Chart($(canvasId),{
    type:"line",data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      scales,
      plugins:{legend:{display:false},tooltip:{backgroundColor:"#1e222d",titleColor:"#d1d4dc",bodyColor:"#d1d4dc",borderColor:"#2a2e39",borderWidth:1}}
    }
  });
}

function renderHistory(history){
  clearCharts();
  if(isBuyCall()) return;
  if(isStockMode()||!history) return;
  const available=(history.available_charts||[])
    .filter(id=>id!=="price"&&history[id]?.timestamps?.length)
    .slice(0,3);
  if(!available.length) return;
  $("chartGrid").className=`chart-grid count-${available.length}`;
  available.forEach((id,index)=>{
    const box=$("chartBox"+index);
    const meta=chartMeta(id);
    box.querySelector("h3").innerHTML=tip(meta.label,meta.tip);
    box.style.display="block";
    makeMarketChart("marketChart"+index,id,history[id],history.price_history);
  });
  $("chartGrid").style.display="grid";
}

  $("stockTab").textContent=t("usStocks");
  $("stockSymbol").placeholder=t("stockPlaceholder");
  $("stockSymbolLabel").textContent=t("stockPlaceholder");
  $("stockSearchBtn").textContent=t("stockSearch");
  $("labelYield").textContent=isBuyCall()?t("maxPremium"):t("minYield");
  $("labelDays").textContent=t("maxDays");
  $("labelStrike").textContent=t("strike");
  $("labelMinStrike").textContent=t("minStrike");
  $("labelMaxStrike").textContent=t("maxStrike");

    renderMarketMeta();

    renderSnapshot();
    render();
    renderHistory(LAST_HISTORY);
  }
}

function toggleLang(){
  _lang=_lang==="zh"?"en":"zh";
  applyLang();
}

function handleCallQuoteDetailToggle(event){
  if(!isBuyCall()) return;
  const button=event.target.closest("[data-call-detail-toggle]");
  if(!button) return;
  const detailId=button.getAttribute("aria-controls");
  const detailRow=detailId?document.getElementById(detailId):null;
  if(!detailRow) return;
  const expanded=button.getAttribute("aria-expanded")==="true";
  button.setAttribute("aria-expanded",String(!expanded));
  button.setAttribute(
    "aria-label",
    expanded?t("expandQuoteDetails"):t("collapseQuoteDetails")
  );
  detailRow.hidden=expanded;
}

function handleQuoteDepthClick(event){
  const button=event.target.closest?.("[data-quote-depth]");
  if(!button||isStockMode()) return;
  const state=quoteDepthState;
  const key=button.dataset.depthKey;
  if(
    !state||!key
    ||state.pending.has(key)
    ||state.queued.has(key)
  ) return;
  state.cache.delete(key);
  setQuoteDepthNodesLoading(state,key);
  enqueueQuoteDepth(button);
}

document.querySelectorAll("[data-asset]").forEach(button=>{
  button.addEventListener("click",()=>selectAsset(button.dataset.asset));
});
$("stockTab").addEventListener("click",()=>selectStock(currentStockSymbol));
$("stockSearch").addEventListener("submit",event=>{
  event.preventDefault();
  selectStock($("stockSymbol").value,true);
});
document.querySelectorAll("[data-timeframe]").forEach(button=>{
  button.addEventListener("click",()=>selectTimeframe(button.dataset.timeframe));
});
$("langBtn").addEventListener("click",toggleLang);
$("refreshBtn").addEventListener("click",refreshDashboard);
["fYield","fDays","fStrike","fSort"].forEach(id=>{
  $(id).addEventListener("change",render);
  $(id).addEventListener("input",()=>{
    clearTimeout(window._renderTimer);
    window._renderTimer=setTimeout(render,250);
  });
});
["fMinStrike","fMaxStrike"].forEach(id=>{
  $(id).addEventListener("change",()=>{
    renderSnapshot();
    render();
  });
  $(id).addEventListener("input",()=>{
    clearTimeout(window._renderTimer);
    window._renderTimer=setTimeout(()=>{
      renderSnapshot();
      render();
    },250);
  });
});
["snapshot","content"].forEach(id=>{
  $(id).addEventListener("click",handleCallQuoteDetailToggle);
  $(id).addEventListener("click",handleQuoteDepthClick);
});
document.addEventListener("pointerover",event=>{
  const target=event.target.closest?.(".tip");
  if(
    !target
    ||(event.relatedTarget&&target.contains(event.relatedTarget))
  ) return;
  showHoverTooltip(target);
});
document.addEventListener("pointerout",event=>{
  const target=event.target.closest?.(".tip");
  if(
    !target
    ||(event.relatedTarget&&target.contains(event.relatedTarget))
  ) return;
  releaseHoverTooltip(target);
});
document.addEventListener("focusin",event=>{
  const target=event.target.closest?.(".tip");
  if(target) showHoverTooltip(target);
});
document.addEventListener("focusout",event=>{
  const target=event.target.closest?.(".tip");
  if(target) releaseHoverTooltip(target);
});
window.addEventListener("scroll",()=>{
  if(activeHoverTip) positionHoverTooltip(activeHoverTip);
},true);
window.addEventListener("resize",()=>{
  if(activeHoverTip) positionHoverTooltip(activeHoverTip);
});
const hoverTooltipObserver=new MutationObserver(()=>{
  hideDetachedHoverTooltip();
});
["snapshot","content","chartGrid"].forEach(id=>{
  hoverTooltipObserver.observe($(id),{
    childList:true,
    subtree:true
  });
});

if(isBuyCall()){
  $("fYield").value="0";
  $("fYield").placeholder="0=all";
  $("fSort").options[0].value="move";
  $("fSort").options[1].value="premium";
}
setAssetButtons();
setTimeframeButtons();
applyLang();
setPriceChartState("loading");
let dashboardStarted=false;
let dashboardRefreshTimer=null;
let buyCallRiskTimer=null;

function refreshDashboard(){
  if(!dashboardStarted)return;
  loadData();
  loadPriceChart();
}

function scheduleDashboardTimers(){
  clearInterval(dashboardRefreshTimer);
  clearInterval(buyCallRiskTimer);
  dashboardRefreshTimer=null;
  buyCallRiskTimer=null;
  if(!dashboardStarted||document.hidden)return;
  if(!isBuyCall()){
    dashboardRefreshTimer=setInterval(()=>{
      if(isStockMode())return;
      refreshDashboard();
    },120000);
  }else{
    buyCallRiskTimer=setInterval(renderBuyCallRisk,5000);
  }
}

function startDashboard(){
  if(dashboardStarted)return;
  dashboardStarted=true;
  refreshDashboard();
  scheduleDashboardTimers();
}

document.addEventListener("visibilitychange",()=>{
  if(!dashboardStarted)return;
  if(document.hidden){scheduleDashboardTimers();return}
  refreshDashboard();
  scheduleDashboardTimers();
});

window.MangoDashboard={
  start:startDashboard,
  refresh:refreshDashboard,
  rerender:()=>{renderSnapshot();render()},
  apiUrl:(path,asset)=>apiUrl(path,asset),
  getState:()=>({
    data:DATA,timing:LAST_TIMING,history:LAST_HISTORY,
    asset:currentAsset,market:currentMarket,strategy:STRATEGY_MODE,
  }),
};

if(!IS_OWNER_ROUTE)startDashboard();
