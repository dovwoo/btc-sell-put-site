<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0" integrity="sha384-cVMg8E3QFwTvGCDuK+ET4PD341jF3W8nO1auiXfuZNQkzbUUiBGLsIQUE+b1mxws" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:dark;
  --bg:#0a0c10;--panel:#11141a;--panel2:#161a22;--panel3:#1c212b;
  --line:#1e232d;--line2:#262c38;--line3:#323a48;
  --text:#c9ced6;--text2:#9aa1ad;--muted:#7a8290;--faint:#4a5260;
  --amber:#d4a024;--amber-bright:#f0b93a;--amber-dim:#8a6c1a;
  --green:#3fa47f;--red:#c75454;
  --mono:"SF Mono","Menlo","Consolas","DejaVu Sans Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;
}
html{font-feature-settings:"tnum" 1,"lnum" 1}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
html.owner-pending body{visibility:hidden}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
/* ============ TOP BAR ============ */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);height:38px;background:var(--panel)}
.bar h1{font-family:var(--mono);font-size:.78rem;color:var(--text);font-weight:600;text-align:center;letter-spacing:.04em;text-transform:uppercase}
.bar .right{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.bar .ts{font-family:var(--mono);font-size:.66rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lang{justify-self:start;background:transparent;color:var(--muted);border:1px solid var(--line2);padding:3px 10px;border-radius:0;font-family:var(--mono);font-size:.66rem;cursor:pointer;letter-spacing:.05em}
.lang:hover{color:var(--amber);border-color:var(--amber-dim)}
.nav{display:flex;align-items:center;border:1px solid var(--line2);border-radius:0;overflow:hidden;background:transparent}
.nav a{color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:.66rem;padding:4px 10px;border-right:1px solid var(--line2);background:transparent;white-space:nowrap;letter-spacing:.05em;text-transform:uppercase}
.nav a:last-child{border-right:0}
.nav a:hover{color:var(--text);background:var(--panel2)}
.nav a.on{color:var(--amber);background:transparent;box-shadow:inset 0 -1px 0 var(--amber)}
/* ============ MAIN LAYOUT ============ */
.wrap{padding:12px 16px;max-width:1440px;margin:0 auto}
/* ============ MARKET STATUS LINE ============ */
.market-line{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.asset-switch{display:inline-flex;border:1px solid var(--line2);border-radius:0;overflow:hidden;background:transparent}
.asset-switch button{min-width:56px;height:28px;padding:0 12px;border:0;border-right:1px solid var(--line2);background:transparent;color:var(--muted);font-family:var(--mono);font-size:.7rem;font-weight:600;cursor:pointer;letter-spacing:.04em}
.asset-switch button:last-child{border-right:0}
.asset-switch button:hover{color:var(--text);background:var(--panel2)}
.asset-switch button.on{background:transparent;color:var(--amber);box-shadow:inset 0 -1px 0 var(--amber)}
.stock-search{display:none;align-items:center;gap:6px;flex-wrap:wrap}
.stock-search.on{display:flex}
.stock-search input{width:150px;height:28px;padding:0 9px;border:1px solid var(--line2);border-radius:0;background:transparent;color:var(--text);font-family:var(--mono);font-size:.7rem;text-transform:uppercase}
.stock-search button{height:28px;padding:0 11px;border:1px solid var(--amber);border-radius:0;background:transparent;color:var(--amber);font-family:var(--mono);font-size:.66rem;cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.stock-search button:hover{background:var(--amber);color:var(--bg)}
.stock-search-error{font-size:.64rem;color:var(--red)}
.stock-search-error:empty{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.price{font-family:var(--mono);font-size:1.4rem;font-weight:600;letter-spacing:-.01em;color:var(--text);font-variant-numeric:tabular-nums}
.spot-label{font-family:var(--mono);font-size:.66rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.refresh{background:transparent;color:var(--muted);border:1px solid var(--line2);padding:4px 10px;border-radius:0;font-family:var(--mono);font-size:.66rem;cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.refresh:hover{color:var(--amber);border-color:var(--amber-dim)}
.market-meta{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin:4px 0 10px 1px;min-height:1em;letter-spacing:.03em}
.market-meta.delayed{color:var(--amber)}
/* ============ RISK NOTE / ACTION BANNER ============ */
.risk-note{display:none;margin:0 0 12px;padding:8px 11px;border:1px solid var(--amber-dim);border-left:2px solid var(--amber);background:var(--panel);color:var(--text2);font-size:.68rem;line-height:1.5}
.action-banner{padding:9px 12px;margin-bottom:12px;display:flex;align-items:center;gap:12px;border:1px solid var(--line2);border-left:2px solid var(--muted);background:var(--panel)}
.action-banner .act-badge{font-family:var(--mono);font-size:.66rem;font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:0;letter-spacing:.06em;text-transform:uppercase}
.action-banner .act-reason{font-size:.7rem;color:var(--text);line-height:1.45;flex:1}
.action-banner.sell{border-left-color:var(--green)}
.action-banner.sell .act-badge{background:transparent;color:var(--green);border:1px solid var(--green)}
.action-banner.wait{border-left-color:var(--amber)}
.action-banner.wait .act-badge{background:transparent;color:var(--amber);border:1px solid var(--amber)}
.action-banner.no{border-left-color:var(--red)}
.action-banner.no .act-badge{background:transparent;color:var(--red);border:1px solid var(--red)}
/* ============ PRICE CHART ============ */
.price-chart-panel{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:10px 12px 7px;margin-bottom:12px}
.price-chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:5px}
.price-chart-head h2{font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--text);line-height:1.4;letter-spacing:.04em;text-transform:uppercase}
.price-chart-meta{display:block;font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:1px}
.timeframe-switch{display:inline-flex;flex-shrink:0;border:1px solid var(--line2);border-radius:0;overflow:hidden;background:transparent}
.timeframe-switch button{min-width:40px;height:24px;padding:0 8px;border:0;border-right:1px solid var(--line2);background:transparent;color:var(--muted);font-family:var(--mono);font-size:.62rem;font-weight:500;cursor:pointer}
.timeframe-switch button:last-child{border-right:0}
.timeframe-switch button:hover{color:var(--text);background:var(--panel2)}
.timeframe-switch button.on{background:transparent;color:var(--amber);box-shadow:inset 0 -1px 0 var(--amber)}
.price-chart-stage{height:200px;position:relative;min-width:0}
.price-chart-canvas{width:100%;height:100%}
.price-chart-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:.68rem;background:var(--panel);z-index:2}
.price-chart-state.error{color:var(--red)}
.price-chart-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:18px;padding-top:3px;font-family:var(--mono);font-size:.58rem;color:var(--faint)}
.price-chart-foot .stale{color:var(--amber)}
.tv-credit{color:var(--faint);text-decoration:none;white-space:nowrap}
.tv-credit:hover{color:var(--muted)}
/* ============ SECONDARY CHART GRID ============ */
.context-charts{margin-top:18px;border:1px solid var(--line2);background:var(--panel)}
.context-charts>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;cursor:pointer;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);list-style:none;min-height:36px}
.context-charts>summary::-webkit-details-marker{display:none}
.context-charts>summary::before{content:"▸";color:var(--amber);font-size:.7rem;margin-right:8px;transition:transform .15s ease}
.context-charts[open]>summary::before{transform:rotate(90deg)}
.context-charts>summary span:first-child{display:flex;align-items:center}
.context-charts>summary span:last-child{color:var(--faint);font-size:.56rem;letter-spacing:.03em;text-transform:none}
.context-charts[open]>summary{border-bottom:1px solid var(--line2)}
.context-charts .chart-grid{margin:0;padding:10px 12px}
.chart-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.chart-grid.count-1{grid-template-columns:1fr}
.chart-grid.count-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:9px 11px;min-width:0}
.chart-box h3{font-family:var(--mono);font-size:.68rem;color:var(--text2);font-weight:600;margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
.chart-box canvas{width:100%!important;height:190px!important}
/* ============ TOOLTIP ============ */
.tip{position:relative;cursor:help;border-bottom:1px dashed var(--faint)}
.tip .tt{display:none}
.hover-tooltip{visibility:hidden;position:fixed;z-index:1000;left:0;top:0;width:min(260px,calc(100vw - 24px));padding:7px 9px;border:1px solid var(--line3);border-radius:0;background:var(--panel3);color:var(--text);font-size:.66rem;font-weight:400;line-height:1.45;text-align:left;white-space:normal;overflow-wrap:anywhere;pointer-events:none;opacity:0;transition:opacity .12s}
.hover-tooltip.on{visibility:visible;opacity:1}
/* ============ SNAPSHOT & TABLE ============ */
.snapshot{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:10px 12px;margin-bottom:12px}
.snapshot h2{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:.72rem;color:var(--text);font-weight:600;margin-bottom:7px;letter-spacing:.04em;text-transform:uppercase}
.snapshot .meta{font-size:.6rem;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.snapshot select{background:transparent;border:1px solid var(--line2);color:var(--text);padding:2px 6px;border-radius:0;font-family:var(--mono);font-size:.72rem;font-weight:600}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{color:var(--muted);font-family:var(--mono);font-size:.62rem;font-weight:500;text-align:right;padding:5px 8px;border-bottom:1px solid var(--line2);letter-spacing:.04em;text-transform:uppercase}
td{padding:5px 8px;text-align:right;font-family:var(--mono);font-size:.72rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
.cell-note{display:block;font-size:.56rem;color:var(--muted);font-weight:400;margin-top:1px}
/* ============ DEPTH & QUOTES ============ */
.quote-depth{display:inline-block;white-space:nowrap;color:var(--text);font-weight:500;font-family:var(--mono)}
button.quote-depth{padding:1px 0;border:0;border-bottom:1px dotted var(--faint);background:transparent;font:inherit;font-weight:500;line-height:1.25;cursor:pointer}
button.quote-depth.idle{color:var(--muted);font-weight:400}
button.quote-depth:hover{color:var(--amber);border-color:var(--muted)}
button.quote-depth:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
button.quote-depth[aria-disabled="true"]{cursor:wait;opacity:.65}
.quote-depth.stale{color:var(--amber)}
.quote-detail-toggle{display:inline-flex;align-items:center;gap:4px;margin-top:3px;padding:1px 0;border:0;border-bottom:1px dotted var(--faint);background:transparent;color:var(--muted);font-size:.56rem;cursor:pointer;font-family:var(--mono);letter-spacing:.03em}
.quote-detail-toggle:hover{color:var(--text);border-color:var(--muted)}
.quote-detail-toggle.warning{color:var(--amber);border-color:var(--amber-dim);font-weight:600}
.quote-detail-toggle.danger{color:var(--red);border-color:var(--red);font-weight:600}
.quote-detail-chevron{display:inline-block;transition:transform .15s ease}
.quote-detail-toggle[aria-expanded="true"] .quote-detail-chevron{transform:rotate(90deg)}
.quote-detail-row[hidden]{display:none}
.quote-detail-row td{padding:0;border-bottom:1px solid var(--line2);background:var(--panel2);text-align:left}
.quote-detail-inner{padding:9px 11px;white-space:normal}
.quote-detail-grid{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:8px 18px}
.quote-detail-item span{display:block;color:var(--muted);font-family:var(--mono);font-size:.56rem;margin-bottom:2px;letter-spacing:.04em;text-transform:uppercase}
.quote-detail-item strong{display:block;color:var(--text);font-family:var(--mono);font-size:.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.quote-detail-item strong.warning{color:var(--amber)}
.quote-detail-item strong.danger{color:var(--red)}
.quote-detail-note{margin-top:7px;color:var(--muted);font-size:.58rem;line-height:1.45;white-space:normal}
/* ============ FILTERS ============ */
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.filters label{font-family:var(--mono);font-size:.64rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.filters select,.filters input{background:transparent;border:1px solid var(--line2);color:var(--text);padding:4px 7px;border-radius:0;font-family:var(--mono);font-size:.7rem}
.filters input{width:76px}
.call-strike-range{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.call-strike-range[hidden]{display:none}
.filters .range-field{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.filters .call-strike-range input{width:96px}
.state{font-size:.72rem;color:var(--muted);padding:14px 0}
.error{color:var(--red)}
/* ============ EXPIRY GROUP HEADERS ============ */
#content>section>div:first-child{font-family:var(--mono)!important;font-size:.72rem!important;font-weight:600!important;color:var(--text)!important;letter-spacing:.05em!important;padding:8px 0 4px!important;border-bottom:1px solid var(--line2)!important;margin-bottom:0!important}
#content>section{margin-bottom:18px!important}
/* ============ OWNER LOGIN ============ */
.owner-login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.owner-route .owner-login{display:flex}.owner-authenticated .owner-login{display:none}
.owner-route:not(.owner-authenticated) .bar,.owner-route:not(.owner-authenticated) main,.owner-route:not(.owner-authenticated) .hover-tooltip{display:none!important}
.owner-login-panel{width:min(380px,100%);border-top:2px solid var(--amber);border-bottom:1px solid var(--line2);padding:32px 2px 24px;background:transparent}
.owner-login-mark{display:flex;align-items:center;gap:9px;margin-bottom:28px;color:var(--amber);font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.18em}
.owner-login-mark:before{content:"";width:24px;height:1px;background:var(--amber)}
.owner-login-panel h1{font-family:var(--mono);font-size:1.2rem;letter-spacing:.02em;margin-bottom:8px;font-weight:600}
.owner-login-panel>p{color:var(--muted);font-size:.7rem;line-height:1.55;margin-bottom:26px}
.owner-login-panel label,.owner-form-grid label,.owner-account-grid label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase}
.owner-login-panel input,.owner-form-grid input,.owner-form-grid select,.owner-account-grid input{width:100%;height:38px;border:1px solid var(--line2);border-radius:0;background:var(--panel);color:var(--text);padding:0 10px;font-family:var(--mono);font-size:.78rem}
.owner-login-panel input:focus,.owner-form-grid input:focus,.owner-form-grid select:focus,.owner-account-grid input:focus{border-color:var(--amber-dim);outline:none}
.owner-login-panel form{display:grid;gap:13px}.owner-login-panel form[hidden]{display:none}.owner-login-panel form>p{color:var(--muted);font-size:.66rem;line-height:1.5}.owner-login-panel form>p strong{color:var(--text);font-weight:600;overflow-wrap:anywhere}
.owner-login-error,.owner-dialog-error{min-height:1.1em;color:var(--red);font-size:.64rem;font-family:var(--mono)}
.owner-login-error.ok{color:var(--green)}
.owner-primary{border:1px solid var(--amber);border-radius:0;background:transparent;color:var(--amber);min-height:36px;padding:0 14px;font-family:var(--mono);font-size:.68rem;font-weight:600;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.owner-primary:hover{background:var(--amber);color:var(--bg)}
.owner-primary:disabled{opacity:.4;cursor:not-allowed}
.owner-primary:disabled:hover{background:transparent;color:var(--amber)}
.owner-quiet{border:1px solid var(--line2);border-radius:0;background:transparent;color:var(--muted);min-height:32px;padding:0 11px;font-family:var(--mono);font-size:.64rem;cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.owner-quiet:hover{color:var(--text);border-color:var(--line3)}
/* ============ OWNER ACCOUNT BAR ============ */
.owner-account-bar{margin-bottom:14px;border:1px solid var(--line);border-top:2px solid var(--amber);background:var(--panel);padding:14px 16px 12px}
.owner-account-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:13px}
.owner-account-head>div:first-child{display:flex;align-items:baseline;gap:12px}
.owner-account-head strong{font-family:var(--mono);font-size:.88rem;font-weight:600;letter-spacing:.02em}
.owner-account-head small{color:var(--muted);font-family:var(--mono);font-size:.62rem;letter-spacing:.04em}
.owner-account-actions{display:flex;align-items:center;gap:7px}
.owner-account-actions .owner-quiet{min-height:32px;padding:0 11px;font-size:.62rem}
.owner-account-actions button:disabled{cursor:wait;opacity:.5}
.owner-save-state{font-size:.6rem;color:var(--muted)}
.owner-account-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;border:1px solid var(--line2);background:var(--line2)}
.owner-account-metric{min-width:0;min-height:64px;padding:10px 12px;border:0;background:var(--panel2);display:flex;flex-direction:column;justify-content:flex-start;gap:2px}
.owner-account-metric span{font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;line-height:1.35}
.owner-account-metric strong{margin-top:5px;font-family:var(--mono);font-size:.92rem;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;letter-spacing:-.01em}
.owner-account-metric.owner-account-hero strong{font-size:1.2rem}
.owner-account-metric small{display:block;margin-top:3px;color:var(--faint);font-family:var(--mono);font-size:.54rem;line-height:1.3}
.owner-account-metric em{font-size:.68rem;font-style:normal;color:var(--muted)}
.owner-account-metric.bad strong,.bad{color:var(--red)!important}
.owner-account-metric.warn strong,.warn{color:var(--amber)!important}
.muted{color:var(--muted)!important}
.good{color:var(--green)!important}
.owner-account-meta{display:flex;gap:24px;padding:10px 2px 0;color:var(--muted);font-family:var(--mono);font-size:.6rem;letter-spacing:.03em}
.owner-account-meta strong{margin-left:5px;color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
.owner-capital{margin-top:11px;border-top:1px solid var(--line2)}
.owner-capital summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0 2px;cursor:pointer;color:var(--text2);font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase}
.owner-capital summary span:last-child{color:var(--faint);font-size:.56rem;font-weight:400;letter-spacing:.02em;text-transform:none}
.owner-capital-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;margin-top:8px;background:var(--line2);border:1px solid var(--line2)}
.owner-capital-grid>div{min-width:0;background:var(--panel2);padding:9px}
.owner-capital-grid span{display:block;color:var(--muted);font-family:var(--mono);font-size:.54rem;line-height:1.35;letter-spacing:.04em;text-transform:uppercase}
.owner-capital-grid strong{display:block;margin-top:4px;font-family:var(--mono);font-size:.74rem;font-weight:600;font-variant-numeric:tabular-nums}
.owner-capital-note{padding-top:9px;color:var(--muted);font-size:.6rem;line-height:1.5}
.owner-private-error{margin-top:10px;padding-top:9px;border-top:1px solid var(--line2);color:var(--red);font-size:.64rem;font-family:var(--mono)}
.owner-private-error button{border:0;background:transparent;color:var(--amber);cursor:pointer;text-decoration:underline;font-family:var(--mono);font-size:.64rem}
/* ============ OWNER NOTICE / ENTRY CARD ============ */
.owner-notice{margin:0 0 10px;padding:8px 10px;border-left:2px solid var(--green);background:var(--panel2);color:var(--green);font-family:var(--mono);font-size:.64rem;letter-spacing:.02em}
.owner-notice.bad{border-left-color:var(--red);color:var(--red)}
.owner-notice[hidden]{display:none}
.owner-entry-card{display:flex!important;align-items:center;gap:11px;min-height:38px;margin:0 0 12px;padding:8px 12px;border:1px solid var(--line2);border-left:2px solid var(--muted);background:var(--panel)}
.owner-entry-card>span{color:var(--muted);font-family:var(--mono);font-size:.56rem;text-transform:uppercase;letter-spacing:.1em}
.owner-entry-card strong{font-family:var(--mono);font-size:.74rem;font-weight:600;white-space:nowrap}
.owner-entry-card p{font-size:.66rem;color:var(--text2);line-height:1.4;flex:1}
.owner-entry-card.warn{border-left-color:var(--amber)}
.owner-entry-card.warn strong{color:var(--amber)}
.owner-entry-card.bad{border-left-color:var(--red)}
.owner-entry-card.bad strong{color:var(--red)}
/* ============ OWNER PAGE HEAD / WORKSPACE ============ */
.owner-positions-page{margin-bottom:20px;min-width:0}
.owner-page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:4px 0 14px;padding-bottom:11px;border-bottom:1px solid var(--line2);min-width:0}
.owner-page-head h2{font-family:var(--mono);font-size:1.05rem;letter-spacing:.02em;margin:4px 0;font-weight:600}
.owner-page-head p{font-size:.64rem;color:var(--muted);font-family:var(--mono);letter-spacing:.02em}
.owner-page-head .owner-primary{min-height:36px;padding:0 13px;font-size:.64rem}
.owner-kicker{color:var(--amber);font-family:var(--mono);font-size:.54rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.owner-workspace{display:grid;grid-template-columns:minmax(380px,.85fr) minmax(560px,1.35fr);min-height:500px;border:1px solid var(--line2);background:var(--bg)}
.owner-list-panel{min-width:0;border-right:1px solid var(--line2);background:var(--panel)}
.owner-position-toolbar{display:flex;align-items:center;height:40px;margin:0;padding:0 12px;border-bottom:1px solid var(--line2);background:var(--panel2)}
.owner-position-toolbar button{min-height:40px;padding:0 12px;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--muted);font-family:var(--mono);font-size:.64rem;cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.owner-position-toolbar button:hover{color:var(--text)}
.owner-position-toolbar button[aria-pressed="true"]{border-bottom-color:var(--amber);color:var(--amber)}
.owner-position-toolbar strong{margin-left:3px;color:inherit;font-size:.62rem;font-weight:600}
.owner-position-list{padding:6px}
.owner-position-item{display:grid;width:100%;grid-template-columns:minmax(0,1.2fr) minmax(80px,.7fr) minmax(92px,.7fr) minmax(75px,.6fr);grid-template-areas:"contract apr pnl dte" "state state state state";gap:8px 12px;margin:0 0 4px;padding:11px 12px;border:1px solid transparent;border-radius:0;background:transparent;color:var(--text);text-align:left;cursor:pointer;transition:background-color .12s ease,border-color .12s ease}
.owner-position-item:hover{background:var(--panel2);border-color:var(--line2)}
.owner-position-item:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
.owner-position-item.selected{border-color:var(--line3);background:var(--panel2);box-shadow:inset 2px 0 var(--amber)}
.owner-position-contract{grid-area:contract}
.owner-position-apr{grid-area:apr}
.owner-position-pnl{grid-area:pnl}
.owner-position-dte{grid-area:dte}
.owner-position-state{grid-area:state;display:flex;align-items:center;gap:7px;padding-top:7px;border-top:1px solid var(--line)}
.owner-position-item strong{display:block;font-family:var(--mono);font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.owner-position-contract>strong{font-size:.82rem}
.owner-position-item small{display:block;margin-top:3px;color:var(--muted);font-family:var(--mono);font-size:.58rem;line-height:1.35}
.owner-position-state i{width:5px;height:5px;border-radius:0;background:var(--faint)}
.owner-position-state strong{font-size:.62rem;letter-spacing:.03em;text-transform:uppercase}
.owner-position-state.bad i{background:var(--red)}
.owner-position-state.bad strong{color:var(--red)}
.owner-position-state.warn i{background:var(--amber)}
.owner-position-state.warn strong{color:var(--amber)}
.owner-position-state.good i{background:var(--green)}
.owner-position-state.good strong{color:var(--green)}
.owner-position-inspector{min-width:0;background:var(--panel)}
.owner-position-detail{padding:18px 20px 20px}
.owner-inspector-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.owner-inspector-head h3{margin:4px 0 2px;font-family:var(--mono);font-size:1.05rem;letter-spacing:.02em;font-weight:600}
.owner-inspector-head p{color:var(--muted);font-family:var(--mono);font-size:.62rem}
.owner-inspector-head .owner-status{margin-top:2px;padding:4px 8px;border:1px solid currentColor;border-radius:0;font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase}
.owner-inspector-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:14px 0;background:var(--line2);border:1px solid var(--line2)}
.owner-inspector-hero>div{min-height:88px;padding:13px 14px;background:var(--panel2)}
.owner-inspector-hero span{font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.owner-inspector-hero strong{display:block;margin-top:7px;font-family:var(--mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.owner-inspector-hero small{display:block;margin-top:5px;color:var(--faint);font-family:var(--mono);font-size:.58rem}
.owner-inspector-hero .owner-apr-hero{border-top:2px solid var(--amber);background:var(--panel3)}
.owner-inspector-hero .owner-apr-hero strong{font-size:1.55rem;letter-spacing:-.02em}
.owner-inspector-hero .owner-apr-hero.good strong{color:var(--green)}
.owner-inspector-hero .owner-apr-hero.bad strong{color:var(--red)}
.owner-inspector-hero .owner-apr-hero.muted strong{color:var(--muted)}
.owner-detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2)}
.owner-detail-grid+.owner-detail-grid{margin-top:1px;border-top:0}
.owner-detail-grid>div{min-width:0;min-height:58px;padding:9px 11px;background:var(--panel2)}
.owner-detail-grid span{display:block;color:var(--muted);font-family:var(--mono);font-size:.54rem;line-height:1.3;letter-spacing:.04em;text-transform:uppercase}
.owner-detail-grid strong{display:block;margin-top:4px;font-family:var(--mono);font-size:.74rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.owner-detail-grid small{display:block;margin-top:2px;color:var(--faint);font-family:var(--mono);font-size:.52rem}
.owner-detail-grid.owner-quote-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
.owner-quote-strip>div{background:var(--panel3)}
.owner-quote-strip strong{font-size:.86rem}
.owner-quote-warning{margin-top:10px;padding:8px 10px;border-left:2px solid var(--red);background:var(--panel2);color:var(--red);font-size:.62rem;line-height:1.45;font-family:var(--mono)}
.owner-secondary-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.owner-secondary-actions .owner-quiet{min-height:36px}
.owner-empty{padding:22px;color:var(--muted);font-family:var(--mono);font-size:.68rem;text-align:center}
/* ============ PROGRESS AXIS ============ */
.owner-progress-axis{margin:0 0 14px;padding:12px 14px 13px;border:1px solid var(--line2);background:var(--panel2)}
.owner-axis-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:9px}
.owner-axis-head>div{display:flex;align-items:baseline;gap:9px}
.owner-axis-head strong{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.owner-axis-head small{color:var(--faint);font-family:var(--mono);font-size:.54rem}
.owner-axis-scale,.owner-axis-row{display:grid;grid-template-columns:100px minmax(0,1fr) 64px;align-items:center;gap:11px}
.owner-axis-ticks{grid-column:2;display:flex;justify-content:space-between;color:var(--faint);font-family:var(--mono);font-size:.52rem;font-variant-numeric:tabular-nums}
.owner-axis-row{min-height:36px}
.owner-axis-label{color:var(--text2);font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase}
.owner-axis-label small,.owner-axis-row>strong small{display:block;margin-top:3px;color:var(--faint);font-family:var(--mono);font-size:.52rem;font-weight:400;white-space:nowrap;letter-spacing:0;text-transform:none}
.owner-axis-row>strong{text-align:right;font-family:var(--mono);font-size:.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.owner-axis-track{position:relative;height:8px;background:repeating-linear-gradient(90deg,var(--line2) 0,var(--line2) 1px,transparent 1px,transparent 25%),var(--panel3)}
.owner-axis-fill{position:absolute;inset:2px auto 2px 0;width:var(--axis-pct);background:var(--green)}
.owner-axis-marker{position:absolute;top:-4px;left:var(--axis-pct);width:2px;height:16px;background:var(--green);transform:translateX(-1px)}
.owner-axis-threshold{position:absolute;top:-2px;left:var(--axis-pct);width:0;height:12px;border-left:1px dashed var(--faint);opacity:.8}
.owner-axis-row.time .owner-axis-fill,.owner-axis-row.time .owner-axis-marker{background:var(--amber)}
.owner-axis-row.bad .owner-axis-fill,.owner-axis-row.bad .owner-axis-marker{background:var(--red)}
.owner-axis-row.muted .owner-axis-fill{display:none}
.owner-axis-marker.unavailable{display:none}
.owner-axis-row.premium>strong{color:var(--green)}
.owner-axis-row.time>strong{color:var(--amber)}
.owner-axis-row.bad>strong{color:var(--red)}
.owner-axis-row.muted>strong{color:var(--muted)}
/* ============ ADVANCED RESEARCH ============ */
.owner-advanced{margin-top:16px}
.owner-section-label{margin-bottom:7px;color:var(--muted);font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase}
.owner-research-card{border:1px solid var(--line2);background:var(--panel2);margin-top:12px}
.owner-research-card summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;cursor:pointer;font-family:var(--mono);font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;min-height:38px}
.owner-research-card summary span:last-child{color:var(--faint);font-size:.56rem;letter-spacing:.02em;text-transform:none}
.owner-research-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line2);border-top:1px solid var(--line2)}
.owner-research-grid>div{background:var(--panel2);padding:9px}
.owner-research-grid span{display:block;color:var(--muted);font-family:var(--mono);font-size:.54rem;margin-bottom:3px;letter-spacing:.04em;text-transform:uppercase}
.owner-research-grid strong{font-family:var(--mono);font-size:.74rem;font-weight:600;font-variant-numeric:tabular-nums}
.owner-research-table{overflow-x:auto;padding:10px 12px 0}
.owner-research-table table{min-width:520px}
.owner-research-note,.owner-form-note{padding:9px 12px 11px;color:var(--muted);font-size:.58rem;line-height:1.5;font-family:var(--mono)}
/* ============ STRESS CONTROLS ============ */
.owner-stress-controls{display:grid;grid-template-columns:220px minmax(220px,1fr);align-items:center;gap:18px;padding:12px 12px 4px}
.owner-stress-controls>div{display:flex;align-items:center;justify-content:space-between;gap:12px}
.owner-stress-controls span{color:var(--muted);font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase}
.owner-stress-value{display:inline-flex;align-items:center;gap:4px;color:var(--amber);font-weight:600;font-family:var(--mono)}
.owner-stress-value span{color:var(--amber);font-size:.78rem}
.owner-stress-value input{width:66px;min-height:30px;padding:4px 6px;border:1px solid var(--line3);border-radius:0;background:var(--panel);color:var(--amber);font-family:var(--mono);font-size:.78rem;font-weight:600;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.owner-stress-value input:focus{outline:1px solid var(--amber);outline-offset:1px}
.owner-stress-controls>input[type="range"]{width:100%;accent-color:var(--amber);cursor:pointer}
/* ============ OWNER DIALOG ============ */
.owner-dialog{width:min(580px,calc(100vw - 24px));border:1px solid var(--line3);border-radius:0;background:var(--panel);color:var(--text);padding:0;box-shadow:none}
.owner-dialog::backdrop{background:rgba(4,6,10,.8)}
.owner-dialog form{padding:18px}
.owner-dialog-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.owner-dialog-head h2{font-family:var(--mono);font-size:.92rem;margin-top:4px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.owner-dialog-close{border:0;background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;min-width:32px;min-height:32px}
.owner-dialog-close:hover{color:var(--amber)}
.owner-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.owner-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.owner-dialog-actions button,.owner-dialog-close{min-height:36px}
.owner-dialog-error{margin-top:9px}
/* Position entry is a compact workflow, not a full-page data form. */
#ownerPositionDialog{position:fixed;inset:0;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 32px);margin:auto;overflow:hidden;border-color:var(--line3);border-top:2px solid var(--amber);background:#101319;box-shadow:0 24px 72px rgba(0,0,0,.48);outline:1px solid var(--line3);outline-offset:-1px}
#ownerPositionDialog:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#ownerPositionDialog::backdrop{background:rgba(3,5,8,.82);backdrop-filter:blur(2px)}
#ownerPositionDialog form{padding:0}
#ownerPositionDialog .owner-dialog-head{align-items:center;margin:0;padding:18px 20px 16px;border-bottom:1px solid var(--line2)}
#ownerPositionDialog .owner-dialog-head h2{margin-top:3px;font-family:var(--sans);font-size:1.06rem;font-weight:650;letter-spacing:-.01em;text-transform:none}
#ownerPositionDialog .owner-kicker{font-size:.56rem;letter-spacing:.16em}
.owner-dialog-subtitle{margin-top:5px;color:var(--muted);font-size:.65rem;line-height:1.45}
#ownerPositionDialog .owner-dialog-close{display:grid;place-items:center;width:34px;height:34px;min-width:34px;min-height:34px;border:1px solid transparent;color:var(--muted);font-family:var(--sans);font-size:1.25rem;line-height:1}
#ownerPositionDialog .owner-dialog-close:hover{border-color:var(--line2);background:var(--panel2);color:var(--text)}
#ownerPositionDialog .owner-form-grid{padding:18px 20px 17px;gap:14px 12px}
#ownerPositionDialog .owner-form-grid label{gap:7px;color:var(--text2);font-family:var(--sans);font-size:.68rem;font-weight:500;letter-spacing:.01em;text-transform:none}
#ownerPositionDialog .owner-form-grid input,#ownerPositionDialog .owner-form-grid select{height:42px;border-color:var(--line2);background:var(--panel2);padding:0 12px;font-size:.78rem}
#ownerPositionDialog .owner-form-grid input:hover,#ownerPositionDialog .owner-form-grid select:hover{border-color:var(--line3)}
#ownerPositionDialog .owner-form-grid input:focus,#ownerPositionDialog .owner-form-grid select:focus{border-color:var(--amber);box-shadow:0 0 0 1px rgba(212,160,36,.18)}
#ownerPositionDialog .owner-form-note{margin:0 20px;padding:11px 0 13px;border-top:1px solid var(--line);color:var(--muted);font-family:var(--sans);font-size:.62rem;line-height:1.5}
#ownerPositionDialog .owner-dialog-error{min-height:0;margin:0 20px}
#ownerPositionDialog .owner-dialog-error:not(:empty){margin-bottom:12px;padding:9px 10px;border-left:2px solid var(--red);background:rgba(199,84,84,.08)}
#ownerPositionDialog .owner-dialog-actions{margin:0;padding:14px 20px 17px;border-top:1px solid var(--line2);background:rgba(255,255,255,.012)}
#ownerPositionDialog .owner-dialog-actions button{min-width:88px;min-height:38px}
#ownerPositionDialog .owner-dialog-actions .owner-primary{min-width:108px;background:var(--amber);color:var(--bg)}
#ownerPositionDialog .owner-dialog-actions .owner-primary:hover{background:var(--amber-bright);border-color:var(--amber-bright)}
/* ============ OWNER CHAIN CELL ============ */
.owner-chain-action{text-align:right!important}
.owner-holding-badge{display:inline-block;margin-right:7px;padding:2px 6px;background:transparent;color:var(--green);border:1px solid var(--green);font-family:var(--mono);font-size:.56rem;font-weight:600;letter-spacing:.05em}
.owner-link{border:0;border-bottom:1px dotted var(--faint);background:transparent;color:var(--muted);font-family:var(--mono);font-size:.6rem;cursor:pointer;margin-left:8px;padding:1px 0;letter-spacing:.03em}
.owner-link:first-child{margin-left:0}
.owner-link:hover{color:var(--amber);border-color:var(--amber-dim)}
.owner-link:disabled{opacity:.4;cursor:not-allowed;border-color:transparent}
/* ============ OWNER POSITIONS ROUTE OVERRIDES ============ */
.owner-positions-route main.wrap>:not(.owner-account-bar):not(.owner-positions-page){display:none!important}
.owner-positions-route .owner-positions-page{display:block!important}
.owner-positions-route .owner-entry-card{display:flex!important}
/* ============ MISC OWNER ============ */
.owner-route{color-scheme:dark}
.owner-route body{background:var(--bg)}
.owner-positions-route .wrap{max-width:1480px;padding:14px 20px 40px}
.owner-expired{background:rgba(199,84,84,.06)}
.owner-expired-tag{display:block;width:max-content;margin-top:3px;padding:1px 5px;background:transparent;color:var(--red);border:1px solid var(--red);font-family:var(--mono);font-size:.54rem;letter-spacing:.05em}
.owner-status{display:inline-block;font-weight:600;font-family:var(--mono);font-size:.62rem;letter-spacing:.04em}
.owner-reason{display:block;max-width:280px;margin-top:3px;color:var(--muted);font-size:.58rem;line-height:1.4;white-space:normal;font-family:var(--mono)}
/* ============ RESPONSIVE: <=1100px ============ */
@media(max-width:1100px){
  .owner-account-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .owner-detail-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .owner-research-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:980px){
  .owner-account-grid{grid-template-columns:repeat(3,1fr)}
  .owner-account-metric.owner-account-hero{grid-column:span 1}
  .owner-workspace{grid-template-columns:1fr}
  .owner-list-panel{border-right:0;border-bottom:1px solid var(--line2)}
  .owner-position-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .owner-position-item{grid-template-columns:1fr 1fr;grid-template-areas:"contract contract" "apr pnl" "dte dte" "state state"}
  .owner-detail-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:850px){
  .chart-grid,.chart-grid.count-2{grid-template-columns:1fr}
  .chart-box canvas{height:180px!important}
}
/* ============ RESPONSIVE: <=600px (mobile) ============ */
@media(max-width:600px){
  .bar{grid-template-columns:auto 1fr;height:auto;min-height:64px;padding:5px 10px;row-gap:5px}
  .bar h1{font-size:.74rem;text-align:right}
  .bar .right{grid-column:1/-1;width:100%;justify-content:center}
  .bar .ts{display:none}
  .nav{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .nav a{text-align:center;padding:6px 8px;min-height:32px;display:flex;align-items:center;justify-content:center}
  .wrap{padding:10px 10px}
  .market-line{gap:9px}
  .asset-switch{order:0;width:100%}
  .asset-switch button{flex:1;height:32px}
  .price{font-size:1.25rem}
  .stock-search{order:1;width:100%}
  .stock-search input{flex:1;width:auto;height:32px}
  .stock-search button{height:32px}
  .stock-search-error{flex:0 0 100%}
  .price,.spot-label,.refresh{order:2}
  .action-banner{align-items:flex-start;gap:8px;padding:9px 10px}
  .action-banner .act-badge{font-size:.62rem}

function tip(label,copy){

function tooltipPlacement(
  anchorRect,
  tooltipRect,
  viewportWidth,
  viewportHeight,
  margin=12,
  gap=8
){
  const minLeft=margin+tooltipRect.width/2;
  const maxLeft=Math.max(
    minLeft,
    viewportWidth-margin-tooltipRect.width/2
  );
  const left=Math.min(
    maxLeft,
    Math.max(minLeft,anchorRect.left+anchorRect.width/2)
  );
  const above=anchorRect.top-tooltipRect.height-gap;
  const below=anchorRect.bottom+gap;
  const maxTop=Math.max(
    margin,
    viewportHeight-margin-tooltipRect.height
  );
  const preferredTop=above>=margin?above:below;
  const top=Math.min(maxTop,Math.max(margin,preferredTop));
  return {left,top};
}

function resetFloatingTooltipPosition(tooltip){
  ["left","right","top","bottom","transform"].forEach(
    property=>tooltip.style.removeProperty(property)
  );
}

function positionHoverTooltip(target){
  const tooltip=$("hoverTooltip");
  if(!target?.isConnected||!tooltip.classList.contains("on")){
    if(target&&!target.isConnected) hideHoverTooltip(target);
    return;
  }
  if(window.matchMedia("(max-width:600px)").matches){
    resetFloatingTooltipPosition(tooltip);
    return;
  }
  const placement=tooltipPlacement(
    target.getBoundingClientRect(),
    tooltip.getBoundingClientRect(),
    window.innerWidth,
    window.innerHeight
  );
  tooltip.style.left=`${placement.left}px`;
  tooltip.style.right="auto";
  tooltip.style.top=`${placement.top}px`;
  tooltip.style.bottom="auto";
  tooltip.style.transform="translateX(-50%)";
}

function showHoverTooltip(target){
  const source=target?.querySelector(".tt");
  const tooltip=$("hoverTooltip");
  if(!source||!tooltip) return;
  if(activeHoverTip&&activeHoverTip!==target){
    activeHoverTip.removeAttribute("aria-describedby");
  }
  activeHoverTip=target;
  tooltip.textContent=source.textContent;
  tooltip.classList.add("on");
  tooltip.setAttribute("aria-hidden","false");
  target.setAttribute("aria-describedby","hoverTooltip");
  positionHoverTooltip(target);
}

function hideHoverTooltip(target=activeHoverTip){
  if(target&&activeHoverTip&&target!==activeHoverTip) return;
  const tooltip=$("hoverTooltip");
  if(activeHoverTip){
    activeHoverTip.removeAttribute("aria-describedby");
  }
  activeHoverTip=null;
  tooltip.classList.remove("on");
  tooltip.setAttribute("aria-hidden","true");
  resetFloatingTooltipPosition(tooltip);
}

function hideDetachedHoverTooltip(
  target=activeHoverTip,
  hide=hideHoverTooltip
){
  if(!target||target.isConnected) return false;
  hide(target);
  return true;
}

function releaseHoverTooltip(target){
  requestAnimationFrame(()=>{
    if(
      target===activeHoverTip
      &&target.isConnected
      &&(target.matches(":hover")||document.activeElement===target)
    ) return;
    hideHoverTooltip(target);
  });
}

async function loadPriceChart(){
  const market=currentMarket;
  const symbol=currentSymbol();
  const key=selectionKey();
  const timeframe=currentTimeframe;
  const identity=`${market}:${symbol}:${timeframe}`;
  const version=++priceRequestVersion;
  if(priceRequestController) priceRequestController.abort();
  priceRequestController=new AbortController();
  const {signal}=priceRequestController;
  if(priceChartIdentity!==identity) setPriceChartState("loading");
  try{
    const response=await fetch(priceApiUrl(symbol,timeframe,market),{
      signal,
      cache:"no-store",
      headers:market==="us_stock"?{"X-Mango-Owner-Request":"1"}:undefined
    });
    if(version!==priceRequestVersion||key!==selectionKey()||timeframe!==currentTimeframe) return;
    if(!response.ok){
      let detail="";
      try{detail=(await response.json()).error||""}catch(_){}
      throw new Error(detail||`HTTP ${response.status}`);
    }
    const payload=await response.json();
    if(
      version!==priceRequestVersion
      ||key!==selectionKey()
      ||timeframe!==currentTimeframe
      ||(payload.symbol||payload.asset)!==symbol
      ||payload.timeframe!==timeframe
    ) return;
    PRICE_DATA=payload;
    if(!payload.candles?.length){
      destroyPriceChart();
      renderPriceChartCopy(payload);
      setPriceChartState("empty");
      return;
    }
    renderPriceChart(payload);
  }catch(error){
    if(
      error.name==="AbortError"
      ||version!==priceRequestVersion
      ||key!==selectionKey()
      ||timeframe!==currentTimeframe
    ) return;
    PRICE_DATA=null;
    destroyPriceChart();
    renderPriceChartCopy();
    setPriceChartState("error");
  }
}

function reconcileLiveQuote(
  row,
  side,
  payload,
  spotPrice,
  wideSpreadThreshold=30
){
  if(!row||!payload||payload.stale) return false;
  const priceKey=side==="ask"?"best_ask_price":"best_bid_price";
  const sizeKey=side==="ask"?"ask_size":"bid_size";
  const price=finiteNumber(payload?.[priceKey]);
  const size=finiteNumber(payload?.[sizeKey]);
  if(price===null||price<=0||size===null||size<=0){
    const quoteKey=side==="ask"?"ask_usd":"bid_usd";
    const unavailableBasis=`live_${side}_unavailable`;
    const payloadBid=side==="ask"
      ?finiteNumber(payload.best_bid_price)
      :null;
    const alreadyUnavailable=(
      row.quote_basis===unavailableBasis
      &&row[quoteKey]===null
      &&row[`${side}_size`]===null
      &&row.min_premium_usd===null
      &&(
        side==="bid"
          ?(
            row.ann_yield===null
            &&row.net_yield===null
            &&row.fee_usd===null
            &&!("panic_yield" in row)
            &&!("time_yield" in row)
          )
          :(
            row.min_cost_usd===null
            &&row.max_loss_usd===null
            &&row.breakeven_usd===null
            &&row.breakeven_move_pct===null
            &&row.bid_usd===payloadBid
            &&row.quote_quality==="unavailable"
          )
      )
    );
    row.quote_depth_timestamp=payload.quoted_at||null;
    if(alreadyUnavailable) return false;

    row[quoteKey]=null;
    row[`${side}_size`]=null;
    row.min_premium_usd=null;
    row.quote_basis=unavailableBasis;
    row.quote_depth_verified=false;
    if(side==="bid"){
      row.ann_yield=null;
      row.net_yield=null;
      row.fee_usd=null;
      delete row.panic_yield;
      delete row.time_yield;
      return true;
    }
    row.min_cost_usd=null;
    row.max_loss_usd=null;
    row.breakeven_usd=null;
    row.breakeven_move_pct=null;
    row.bid_usd=payloadBid;
    Object.assign(row,{
      mid_usd:null,
      spread_usd:null,
      spread_pct:null,
      spread_warning:true,
      quote_quality:"unavailable"
    });
    return true;
  }

  row[side==="ask"?"ask_usd":"bid_usd"]=price;
  row[`${side}_size`]=size;
  row.quote_basis=`live_${side}`;
  row.quote_depth_verified=true;
  row.quote_depth_timestamp=payload.quoted_at||null;

  const minimum=finiteNumber(row.min_trade_amount);
  if(minimum!==null&&minimum>0){
    row.min_premium_usd=price*minimum;
  }

  if(side==="bid"){
    const strike=finiteNumber(row.strike);
    const days=finiteNumber(row.days);
    const spot=finiteNumber(spotPrice);
    if(strike!==null&&strike>0&&days!==null&&days>0){
      row.ann_yield=price/strike*365/days*100;
      if(spot!==null&&spot>0){
        const fee=Math.min(.0003*spot,.125*price);
        row.fee_usd=fee;
        row.net_yield=Math.max(0,price-fee)/strike*365/days*100;
      }
    }
    delete row.panic_yield;
    delete row.time_yield;
    return true;
  }

  row.min_cost_usd=row.min_premium_usd;
  row.max_loss_usd=row.min_premium_usd;
  const strike=finiteNumber(row.strike);
  const spot=finiteNumber(spotPrice);
  if(strike!==null&&strike>0){
    row.breakeven_usd=strike+price;
    row.breakeven_move_pct=(
      spot!==null&&spot>0
        ?(row.breakeven_usd/spot-1)*100
        :null
    );
  }

  const bid=finiteNumber(payload?.best_bid_price);
  row.bid_usd=bid;
  if(bid===null){
    Object.assign(row,{
      mid_usd:null,
      spread_usd:null,
      spread_pct:null,
      spread_warning:true,
      quote_quality:"unavailable"
    });
  }else if(bid<=0){
    Object.assign(row,{
      mid_usd:null,
      spread_usd:null,
      spread_pct:null,
      spread_warning:true,
      quote_quality:"no_bid"
    });
  }else if(bid>price){
    Object.assign(row,{
      mid_usd:null,
      spread_usd:null,
      spread_pct:null,
      spread_warning:true,
      quote_quality:"crossed"
    });
  }else{
    const midpoint=(bid+price)/2;
    const spread=price-bid;
    const spreadPct=spread/midpoint*100;
    const warning=spreadPct>=Number(wideSpreadThreshold||30);
    Object.assign(row,{
      mid_usd:midpoint,
      spread_usd:spread,
      spread_pct:spreadPct,
      spread_warning:warning,
      quote_quality:warning?"wide":"normal"
    });
  }
  return true;
}

function optionRowReference(instrument){
  const expiries=DATA?.expiries||DATA?.exchanges?.Deribit?.expiries||{};
  const rowKey=isBuyCall()?"calls":"puts";
  for(const group of Object.values(expiries)){
    const row=(group?.[rowKey]||[]).find(
      candidate=>candidate.instrument===instrument
    );
    if(row) return row;
  }
  return null;
}

function scheduleLiveQuoteRender(){
  if(liveQuoteRenderTimer!==null) return;
  const generation=quoteDepthState?.generation;
  liveQuoteRenderTimer=setTimeout(()=>{
    liveQuoteRenderTimer=null;
    if(generation!==quoteDepthState?.generation||!DATA) return;
    const focusedButton=document.activeElement?.closest?.("[data-quote-depth]");
    const focusTarget=focusedButton?{
      key:focusedButton.dataset.depthKey,
      side:focusedButton.dataset.depthSide,
      container:focusedButton.closest("#snapshot")?"snapshot":"content"
    }:null;
    renderSnapshot();
    render();
    if(focusTarget){
      const replacement=[...$(focusTarget.container).querySelectorAll(
        "[data-quote-depth]"
      )].find(node=>(
        node.dataset.depthKey===focusTarget.key
        &&node.dataset.depthSide===focusTarget.side
      ));
      replacement?.focus({preventScroll:true});
    }
  },0);
}

function applyLiveQuotePayload(instrument,side,payload){
  const row=optionRowReference(instrument);
  const updated=reconcileLiveQuote(
    row,
    side,
    payload,
    DATA?.spot_price,
    DATA?.wide_spread_threshold_pct
  );
  if(updated) scheduleLiveQuoteRender();
  return updated;
}

function updateQuoteDepthNode(node,payload){
  node.setAttribute("aria-busy","false");
  node.setAttribute("aria-disabled","false");
  node.classList.remove("idle","loading");
  node.title=payload?.quoted_at
    ?`${t("depthRefreshTip")} · ${payload.quoted_at}`
    :t("depthRefreshTip");
  if(!payload){
    node.textContent=t("depthRetry");
    node.classList.add("stale");
    node.title=t("depthRetryTip");
    return;
  }
  const side=node.dataset.depthSide;
  const size=finiteNumber(payload?.[`${side}_size`]);
  const livePrice=finiteNumber(
    payload?.[side==="ask"?"best_ask_price":"best_bid_price"]
  );
  const displayedPrice=finiteNumber(node.dataset.depthPrice);
  const stale=Boolean(payload&&payload.stale);
  const liveUnavailable=Boolean(payload&&!stale)&&(
    livePrice===null||livePrice<=0||size===null||size<=0
  );
  if(liveUnavailable){
    const instrument=decodeURIComponent(node.dataset.depthInstrument||"");
    if(applyLiveQuotePayload(instrument,side,payload)){
      node.dataset.depthPrice="";
    }
    node.textContent=t("depthUnavailable");
    node.classList.add("stale");
    return;
  }
  const tolerance=displayedPrice===null
    ?0
    :Math.max(.00005,Math.abs(displayedPrice)*1e-8);
  const priceChanged=size!==null&&size>0&&(
    livePrice===null
    ||displayedPrice===null
    ||Math.abs(livePrice-displayedPrice)>tolerance
  );
  if(priceChanged){
    const instrument=decodeURIComponent(node.dataset.depthInstrument||"");
    if(
      livePrice!==null
      &&applyLiveQuotePayload(instrument,side,payload)
    ){
      node.dataset.depthPrice=String(livePrice);
      node.textContent=formatDepthValue(depthValueUsd(livePrice,size));
      node.classList.toggle("stale",false);
      return;
    }
    node.textContent=t("depthPriceChanged");
    node.classList.add("stale");
    return;
  }
  const value=depthValueUsd(livePrice,size);
  node.textContent=formatDepthValue(value);
  node.classList.toggle("stale",stale);
  if(stale) node.textContent+=` · ${t("depthStale")}`;
}

function updateQuoteDepthNodes(state,key,payload){
  if(state!==quoteDepthState) return;
  document.querySelectorAll("[data-quote-depth]").forEach(node=>{
    if(node.dataset.depthKey===key) updateQuoteDepthNode(node,payload);
  });
}

function setQuoteDepthNodeLoading(node){
  node.setAttribute("aria-busy","true");
  node.setAttribute("aria-disabled","true");
  node.classList.remove("idle","stale");
  node.classList.add("loading");
  node.textContent=t("depthLoading");
  node.title="";
}

function setQuoteDepthNodesLoading(state,key){
  if(state!==quoteDepthState) return;
  document.querySelectorAll("[data-quote-depth]").forEach(node=>{
    if(node.dataset.depthKey===key) setQuoteDepthNodeLoading(node);
  });
}

function pumpQuoteDepthQueue(state){
  while(
    state===quoteDepthState
    &&state.active<MAX_QUOTE_DEPTH_CONCURRENCY
    &&state.queue.length
  ){
    const task=state.queue.shift();
    const {key,instrument}=task;
    state.queued.delete(key);
    if(state.cache.has(key)||state.pending.has(key)) continue;
    state.active++;
    const request=fetch(quoteDepthUrl(instrument),{
      signal:state.controller.signal,
      cache:"no-store"
    }).then(async response=>{
      if(!response.ok){
        const error=new Error(`HTTP ${response.status}`);
        error.status=response.status;
        throw error;
      }
      return response.json();
    });
    state.pending.set(key,request);
    request.then(payload=>{
      if(state!==quoteDepthState) return;
      state.cache.set(key,payload);
      updateQuoteDepthNodes(state,key,payload);
    }).catch(error=>{
      if(error.name==="AbortError"||state!==quoteDepthState) return;
      state.cache.set(key,null);
      updateQuoteDepthNodes(state,key,null);
    }).finally(()=>{
      state.pending.delete(key);
      state.active=Math.max(0,state.active-1);
      pumpQuoteDepthQueue(state);
    });
  }
}

function enqueueQuoteDepth(node){
  const state=quoteDepthState;
  if(!state||isStockMode()) return;
  const key=node.dataset.depthKey;
  const instrument=decodeURIComponent(node.dataset.depthInstrument||"");
  if(!key||!instrument) return;
  if(state.cache.has(key)){
    updateQuoteDepthNode(node,state.cache.get(key));
    return;
  }
  if(state.pending.has(key)||state.queued.has(key)) return;
  state.queued.add(key);
  state.queue.push({key,instrument});
  pumpQuoteDepthQueue(state);
}

function activateQuoteDepthLoading(){
  const state=quoteDepthState;
  if(!state||isStockMode()) return;
  document.querySelectorAll("[data-quote-depth]").forEach(node=>{
    const key=node.dataset.depthKey;
    if(state.pending.has(key)||state.queued.has(key)){
      setQuoteDepthNodeLoading(node);
    }else if(state.cache.has(key)){
      updateQuoteDepthNode(node,state.cache.get(key));
    }
  });
}

function emitMarketData(stage,error=null){
  document.dispatchEvent(new CustomEvent("mango:market-data",{detail:{
    stage,error,data:DATA,timing:LAST_TIMING,history:LAST_HISTORY,
    asset:currentAsset,market:currentMarket,strategy:STRATEGY_MODE,
  }}));
}

async function loadData(){
  const market=currentMarket;
  const symbol=currentSymbol();
  const key=selectionKey();
  const version=++requestVersion;
  resetQuoteDepthLoading();
  if(requestController) requestController.abort();
  requestController=new AbortController();
  const controller=requestController;
  const {signal}=controller;
  $("content").className="state";
  $("content").textContent=loadingCopy();
  try{
    const optionsUrl=isBuyCall()
      ?(market==="us_stock"
        ?`/api/us-stocks/buy-call?ticker=${encodeURIComponent(symbol)}`
        :apiUrl("/api/buy-call",symbol))
      :(market==="us_stock"
        ?`/api/us-stocks/options?ticker=${encodeURIComponent(symbol)}`
        :apiUrl("/api/options",symbol));
    const needsSellPutContext=market==="crypto"&&!isBuyCall();
    const contextPromise=needsSellPutContext
      ?Promise.all([
        optionalJson(apiUrl("/api/timing",symbol),signal),
        optionalJson(apiUrl("/api/timing-history",symbol),signal)
      ]).catch(()=>[null,null])
      :Promise.resolve([null,null]);
    const optionResponse=await fetch(optionsUrl,{
      signal,
      cache:"no-store",
      headers:market==="us_stock"?{"X-Mango-Owner-Request":"1"}:undefined
    });
    if(version!==requestVersion||key!==selectionKey()) return;
    if(!optionResponse.ok){
      let detail="";
      try{detail=(await optionResponse.json()).error||""}catch(_){}
      const error=new Error(detail||`HTTP ${optionResponse.status}`);
      error.status=optionResponse.status;
      throw error;
    }
    DATA=await optionResponse.json();
    if(
      version!==requestVersion
      ||key!==selectionKey()
      ||(DATA.symbol||DATA.asset)!==symbol
    ) return;
    DATA_RECEIVED_AT=Date.now();
    LAST_TIMING=null;
    LAST_HISTORY=null;
    $("spotPrice").textContent=formatPrice(DATA.spot_price,DATA.price_decimals);
    $("spotLabel").textContent=market==="us_stock"?`${symbol} ${t("stockSpot")}`:`${symbol} Spot`;
    $("ts").textContent=market==="us_stock"
      ?(DATA.updated?t("retrievedAt").replace("{time}",DATA.updated):"")
      :DATA.provider_timestamp||DATA.quoted_at||DATA.updated||"";
    renderBuyCallRisk();
    renderMarketMeta();
    renderAction(null);
    renderSnapshot();
    render();
    renderHistory(null);
    emitMarketData("chain");
    const [timing,history]=await contextPromise;
    if(
      version!==requestVersion
      ||key!==selectionKey()
      ||signal.aborted
      ||(DATA?.symbol||DATA?.asset)!==symbol
    ) return;
    LAST_TIMING=timing;
    LAST_HISTORY=history;
    renderAction(timing);
    renderHistory(history);
    emitMarketData("context");
  }catch(error){
    if(error.name==="AbortError"||version!==requestVersion||key!==selectionKey()) return;
    controller.abort();
    DATA=null;
    DATA_RECEIVED_AT=0;
    LAST_TIMING=null;
    LAST_HISTORY=null;
    window._snapStrike=null;
    $("spotPrice").textContent="—";
    $("spotLabel").textContent=market==="us_stock"?`${symbol} ${t("stockSpot")}`:`${symbol} Spot`;
    $("marketMeta").textContent="";
    $("marketMeta").className="market-meta";
    $("ts").textContent="—";
    if(market==="us_stock"){
      $("stockSearchError").textContent=error.status===404
        ?t("stockNotFound").replace("{symbol}",symbol)
        :"";
    }
    $("snapshot").innerHTML="";
    $("content").className="state error";
    $("content").textContent=`${t("fetchError")}: ${error.message}`;
    clearCharts();
    renderAction({
      action:"wait",
      action_label:t("dataUnavailable"),
      action_reason:t("dataUnavailableReason")
    });
    emitMarketData("error",error.message);
  }
}

function optionRows(){
  if(!DATA) return [];
  const rows=[];
  const expiries=DATA.expiries||DATA.exchanges?.Deribit?.expiries||{};
  Object.entries(expiries).forEach(([expiry,group])=>{
    const sideRows=isBuyCall()?group.calls:group.puts;
    (sideRows||[]).forEach(row=>rows.push({...row,expiry:row.expiry||expiry}));
  });
  return rows;
}

function deltaColor(delta){
  if(delta===null||delta===undefined) return "#787b86";
  const absolute=Math.abs(delta);
  if(absolute>=.5) return "#ef5350";
  if(absolute>=.3) return "#ffd600";
  if(absolute>=.15) return "#26a69a";
  return "#7da0ff";
}

function formatDelta(delta){
  if(delta===null||delta===undefined) return "—";
  return `<span style="color:${deltaColor(delta)};font-weight:600">${Number(delta).toFixed(2)}</span>`;
}

function ivColor(iv){
  if(iv===null||iv===undefined) return "#787b86";
  if(iv>=100) return "#ef5350";
  if(iv>=70) return "#ffd600";
  if(iv>=40) return "#26a69a";
  return "#7da0ff";
}

function formatIv(iv){
  if(iv===null||iv===undefined) return "—";
  return `<span style="color:${ivColor(iv)};font-weight:600">${Number(iv).toFixed(1)}%</span>`;
}

function yieldColor(value){
  if(value>=50) return "#ff6d00";
  if(value>=20) return "#ffd600";
  if(value>=10) return "#26a69a";
  return "#787b86";
}

function formatYield(row){
  const annualYield=finiteNumber(row.ann_yield);
  if(annualYield===null) return "—";
  let html=`<span style="color:${yieldColor(annualYield)};font-weight:650">${annualYield.toFixed(1)}%</span>`;
  if(row.panic_yield!==null&&row.panic_yield!==undefined){
    html+=` <span class="cell-note"><span style="color:#ffa726">${Number(row.panic_yield).toFixed(1)}</span> + <span style="color:#7da0ff">${Number(row.time_yield).toFixed(1)}</span></span>`;
  }
  return html;
}

function depthValueUsd(price,size,multiplier=1){
  const normalizedPrice=finiteNumber(price);
  const normalizedSize=finiteNumber(size);
  const normalizedMultiplier=finiteNumber(multiplier);
  if(
    normalizedPrice===null||normalizedPrice<=0
    ||normalizedSize===null||normalizedSize<=0
    ||normalizedMultiplier===null||normalizedMultiplier<=0
  ) return null;
  return normalizedPrice*normalizedSize*normalizedMultiplier;
}

function formatTopDepth(row,side){
  const sizeKey=side==="ask"?"ask_size":"bid_size";
  const priceKey=side==="ask"?"ask_usd":"bid_usd";
  if(isStockMode()){
    const size=finiteNumber(row?.[sizeKey]);
    const price=finiteNumber(row?.[priceKey]);
    const multiplier=row?.contract_multiplier
      ??DATA?.contract_multiplier
      ??100;
    const value=depthValueUsd(price,size,multiplier);
    return `<span class="quote-depth">${formatDepthValue(value)}</span>`;
  }
  const instrument=String(row?.instrument||"");
  if(!instrument){
    return `<span class="quote-depth">—</span>`;
  }
  const key=encodeURIComponent(quoteDepthKey(instrument));
  const encodedInstrument=encodeURIComponent(instrument);
  const displayedPrice=finiteNumber(
    row?.[priceKey]
  );
  return `<button type="button" class="quote-depth idle" data-quote-depth data-depth-key="${key}" data-depth-side="${side}" data-depth-instrument="${encodedInstrument}" data-depth-price="${displayedPrice??""}" aria-busy="false" aria-disabled="false" title="${t("depthViewTip")}">${t("depthView")}</button>`;
}

function formatDepthValue(value){
  const number=finiteNumber(value);
  if(number===null||number<=0) return "—";
  return formatPrice(number,number>=100?0:2);
}

function depthHeader(side){
  const label=side==="ask"?t("topAskDepth"):t("topBidDepth");
  return tip(label,t("depthValueTip"));
}

function formatBid(row){
  const decimals=DATA?.price_decimals===0?2:Math.min(4,(DATA?.price_decimals||2)+1);
  let html=formatPrice(row.bid_usd,decimals);
  if(isStockMode()){
    html+=`<span class="cell-note">${t("contractPremium")} ${formatPrice(row.min_premium_usd,2)} · ${t("obligation")} ${formatPrice(row.min_obligation_usd,2)}</span>`;
    return html;
  }
  if(Number(row.contract_multiplier)>1){
    html+=`<span class="cell-note">min ${formatPrice(row.min_premium_usd,2)} / ${formatAmount(row.min_trade_amount,4)} ${currentSymbol()} · ${t("obligation")} ${formatPrice(row.min_obligation_usd,2)}</span>`;
  }
  return html;
}

function finiteNumber(value){
  if(value===null||value===undefined||value==="") return null;
  const number=Number(value);
  return Number.isFinite(number)?number:null;
}

function getBuyCallStrikeBounds(){
  const min=finiteNumber($("fMinStrike").value);
  const max=finiteNumber($("fMaxStrike").value);
  return {
    min,
    max,
    valid:(min===null||min>=0)
      &&(max===null||max>=0)
      &&(min===null||max===null||min<=max)
  };
}

function filterBuyCallRowsByStrike(rows,bounds=getBuyCallStrikeBounds()){
  if(!bounds.valid) return [];
  return rows.filter(row=>{
    const strike=Number(row.strike);
    return Number.isFinite(strike)
      &&(bounds.min===null||strike>=bounds.min)
      &&(bounds.max===null||strike<=bounds.max);
  });
}

function callCost(row){
  return finiteNumber(row.min_cost_usd??row.min_premium_usd);
}

function callBreakeven(row){
  const provided=finiteNumber(row.breakeven_usd);
  if(provided!==null) return provided;
  const strike=finiteNumber(row.strike);
  const ask=finiteNumber(row.ask_usd);
  return strike!==null&&ask!==null?strike+ask:null;
}

function callBreakevenMove(row){
  const provided=finiteNumber(row.breakeven_move_pct);
  if(provided!==null) return provided;
  const breakeven=callBreakeven(row);
  const spot=finiteNumber(DATA?.spot_price);
  return breakeven!==null&&spot>0?(breakeven/spot-1)*100:null;
}

function callQuoteDecimals(){
  return DATA?.price_decimals===0
    ?2
    :Math.min(4,(DATA?.price_decimals||2)+1);
}

function callQuoteAlert(row){
  const quality=String(row.quote_quality||"unavailable");
  const spreadPct=finiteNumber(row.spread_pct);
  if(quality==="wide"){
    return {
      tone:"warning",
      label:`Spread ${spreadPct===null?"—":spreadPct.toFixed(1)+"%"}`
    };
  }
  if(quality==="no_bid"){
    return {tone:"danger",label:t("noBidWarning")};
  }
  if(quality==="crossed"){
    return {tone:"danger",label:t("crossedWarning")};
  }
  if(quality==="unavailable"){
    return {tone:"danger",label:t("quoteUnavailableWarning")};
  }
  return {tone:"",label:t("quoteDetails")};
}

function callQuoteDetailToggle(row,detailId){
  const alert=callQuoteAlert(row);
  const warningCopy=alert.tone
    ?`<span aria-hidden="true">⚠</span><span>${alert.label} · ${t("viewQuote")}</span>`
    :`<span>${alert.label}</span>`;
  return `<button type="button" class="quote-detail-toggle${alert.tone?" "+alert.tone:""}" data-call-detail-toggle aria-expanded="false" aria-controls="${detailId}" aria-label="${t("expandQuoteDetails")}">${warningCopy}<span class="quote-detail-chevron" aria-hidden="true">▸</span></button>`;
}

function callReferencePrice(row){
  const mark=finiteNumber(row.mark_usd);
  if(mark!==null) return {label:t("markPrice"),value:mark};
  const theo=finiteNumber(row.theo_usd);

  };

function formatCallQuoteValue(value){

}

function callQuoteDetailRow(row,detailId){

function breakevenHeader(){
